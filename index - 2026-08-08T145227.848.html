// Mapped towns — the single source of truth for the two-tier worklist.
// Mapped town  -> only specific unresolved streets surface as targets.
// Unmapped town -> the whole town accrues "map next" pressure by call volume.
// Greene: only Jewett is mapped to the new standard; the old boxes elsewhere are being redone.
const MAPPED_TOWNS = {
  greene:   ['Jewett','Catskill','Greenville'],
  columbia: ['Hudson','Stuyvesant','Greenport','Germantown','Clermont','Livingston','Stockport']
};
// Out-of-county border ZIPs (Ulster/Albany/Columbia edges) — excluded from the worklist,
// matching the audit. Defined at module scope because the audit's copy is function-local.
const WORKLIST_OUT_OF_AREA = new Set(['12477','12498','12143','12453','12480','12495']);
const MAPPED_TOWN_SET = {
  greene:   new Set(MAPPED_TOWNS.greene),
  columbia: new Set(MAPPED_TOWNS.columbia)
};

// Catalog of street names already known to the box data, keyed by ZIP (names + aliases,
// normalized). A mapped-town call that only hit the generic catch-all box (e.g. a house
// number outside a street's mapped range) is NOT a mapping target if the street name is
// already catalogued — the street is mapped, the call just lacked a matching number.
var KNOWN_STREETS_BY_ZIP = (function(){
  var m = {};
  function add(zip, nm){ if(!zip||!nm) return; var k=normalizeStreet(nm); if(!k) return; if(!m[zip]) m[zip]=new Set(); m[zip].add(k); }
  for (var bi=0; bi<GCDES_BOXES.length; bi++){
    var b = GCDES_BOXES[bi];
    var zips = [b.zip].concat(b.altZips||[]);
    (b.streets||[]).forEach(function(st){
      zips.forEach(function(z){
        add(z, st.name);
        (st.aliases||[]).forEach(function(a){ add(z, a); });
      });
    });
  }
  return m;
})();

// Is this a real, mappable street name (not a coordinate pair, bare number, or fragment)?
function isMappableStreet(s){
  if (!s) return false;
  var t = String(s).trim();
  if (t.length < 3) return false;                                      // bare fragments like "3"
  if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(t)) return false;      // raw lat,long
  if (!/[a-z]/i.test(t)) return false;                                 // no letters -> not a street
  return true;
}

// One data pass, displayed per county (Greene "boxes" / Columbia "districts").
function computeMappingWorklist(calls) {
  var townP   = { greene:{}, columbia:{} };
  var streetT = { greene:{}, columbia:{} };
  for (var i=0;i<calls.length;i++){
    var c = calls[i];
    var zip = c.zip || null;
    if (!zip) continue;
    if (WORKLIST_OUT_OF_AREA.has(zip)) continue; // true out-of-county (Saugerties, etc.)
    var county, town, resolvedSpecific = false;
    if (columbiaZipSet.has(zip)) {
      county = 'columbia';
      var distId = c.unmappedArea ? null : resolveColumbiaDistrict(c.address||null, zip, c.locTown||null);
      var dist = distId ? colDistrictLookup[distId] : null;
      town = (dist && dist.municipality) || c.locTown || (columbiaTownsForZip(zip)[0]) || (columbiaZipLookup[zip] && columbiaZipLookup[zip].place) || 'Unknown';
      resolvedSpecific = !!(dist && !dist.generic);
    } else {
      county = 'greene';
      var zl = zipLookup[zip];
      town = zl ? zl.place : ('Unknown ZIP '+zip);
      if (MAPPED_TOWN_SET.greene.has(town)) {
        var bx = (typeof matchAddressToBoxesSafe!=='undefined') ? matchAddressToBoxesSafe(c.address||null, zip, null) : null;
        resolvedSpecific = !!(bx && !bx.unresolved && bx.boxIds && bx.boxIds.length>0 && bx.method && bx.method.indexOf('street')===0);
      }
    }
    var mapped = MAPPED_TOWN_SET[county].has(town);
    if (!mapped) {
      townP[county][town] = (townP[county][town]||0) + 1;            // whole town accrues pressure
    } else if (!resolvedSpecific) {
      var rawSt = c.address ? c.address.replace(/^\s*\d+\s+/,'').split('||')[0].trim() : '';
      if (rawSt && isMappableStreet(rawSt)) {
        var nrm = normalizeStreet(rawSt);
        var known = !!(KNOWN_STREETS_BY_ZIP[zip] && KNOWN_STREETS_BY_ZIP[zip].has(nrm));
        if (!known) {                                                  // genuinely unknown street -> a real target
          var key = nrm + '||' + zip;
          if (!streetT[county][key]) streetT[county][key] = {street:rawSt, zip:zip, town:town, count:0};
          streetT[county][key].count++;
        }
      }
    }
  }
  function townRows(o){ return Object.keys(o).map(function(t){return {town:t, count:o[t]};}).sort(function(a,b){return b.count-a.count;}); }
  function streetRows(o){ return Object.keys(o).map(function(k){return o[k];}).sort(function(a,b){return b.count-a.count;}); }
  return {
    greene:   { towns: townRows(townP.greene),   streets: streetRows(streetT.greene) },
    columbia: { towns: townRows(townP.columbia), streets: streetRows(streetT.columbia) }
  };
}

function computeColumbiaAudit(calls, colResolved) {
  var colUnresolved = [];
  var colZipCounts = {};
  calls.forEach(function(call) {
    var street = call.address || null;
    var zip = call.zip || null;
    if (!zip || !columbiaZipSet.has(zip)) return;
    colZipCounts[zip] = (colZipCounts[zip] || 0) + 1;
    if (call.unmappedArea) {
      var _us = street ? street.replace(/^\d+\s+/, '').split('||')[0] : '⚠ Unmapped area';
      colUnresolved.push({ street: _us, zip: zip, distId: null, unmapped: true });
      return;
    }
    var distId = resolveColumbiaDistrict(street, zip, call.locTown);
    if (!distId) {
      var _s = street ? street.replace(/^\d+\s+/, '') : '(no address)';
      colUnresolved.push({ street: _s, zip: zip, distId: null });
    } else {
      var dist = colDistrictLookup[distId];
      if (dist && dist.generic) {
        var _s2 = street ? street.replace(/^\d+\s+/, '') : '(no address)';
        colUnresolved.push({ street: _s2, zip: zip, distId: distId });
      }
    }
  });
  var colUnresolvedGroups = {};
  colUnresolved.forEach(function(u) {
    var k = (u.street||'')+'||'+(u.zip||'');
    if (!colUnresolvedGroups[k]) colUnresolvedGroups[k] = {street:u.street,zip:u.zip,distId:u.distId,count:0};
    colUnresolvedGroups[k].count++;
  });
  var allRows = Object.values(colUnresolvedGroups).sort(function(a,b){return b.count-a.count;});
  var unresolvedRows = colResolved
    ? allRows.filter(function(r){return !colResolved[(r.street||'')+'||'+(r.zip||'')];})
    : allRows;
  var colZipRows = Object.keys(colZipCounts).map(function(zip) {
    var info = columbiaZipLookup[zip] || {place: zip};
    var hasMapped = COL_DISTRICTS.some(function(d){return !d.generic && d.zip===zip;});
    var isComplete = COL_DISTRICTS.some(function(d){return d.zip===zip && d.complete===true;});
    return {zip:zip, place:info.place, count:colZipCounts[zip], hasMappedDistricts:hasMapped, isComplete:isComplete};
  }).sort(function(a,b){return b.count-a.count;});
  return {unresolvedRows: unresolvedRows, colZipRows: colZipRows};
}

function AuditTab(props) {
  var calls = props.calls || [];
  var auditState = React.useState(false);
  var auditCopied = auditState[0];
  var setAuditCopied = auditState[1];

  // Multi-box reviewed set -- key: "street||zip||box1/box2/..."
  var reviewedState = React.useState(function() {
    try {
      var raw = localStorage.getItem('gcdes-multibox-reviewed-v1');
      return raw ? JSON.parse(raw) : {};
    } catch(e) { return {}; }
  });
  var reviewed = reviewedState[0];
  var setReviewed = reviewedState[1];

  // Columbia unassigned resolved set -- key: "street||zip"
  var colResolvedState = React.useState(function() {
    try {
      var raw = localStorage.getItem('gcdes-col-resolved-v1');
      return raw ? JSON.parse(raw) : {};
    } catch(e) { return {}; }
  });
  var colResolved = colResolvedState[0];
  var setColResolved = colResolvedState[1];

  function markColResolved(key) {
    var next = Object.assign({}, colResolved);
    next[key] = true;
    setColResolved(next);
    try { localStorage.setItem('gcdes-col-resolved-v1', JSON.stringify(next)); } catch(e) {}
  }

  function unmarkColResolved(key) {
    var next = Object.assign({}, colResolved);
    delete next[key];
    setColResolved(next);
    try { localStorage.setItem('gcdes-col-resolved-v1', JSON.stringify(next)); } catch(e) {}
  }

  var showReviewedState = React.useState(false);
  var showReviewed = showReviewedState[0];
  var setShowReviewed = showReviewedState[1];

  function markReviewed(key) {
    var next = Object.assign({}, reviewed);
    next[key] = true;
    setReviewed(next);
    try { localStorage.setItem('gcdes-multibox-reviewed-v1', JSON.stringify(next)); } catch(e) {}
  }

  function unmarkReviewed(key) {
    var next = Object.assign({}, reviewed);
    delete next[key];
    setReviewed(next);
    try { localStorage.setItem('gcdes-multibox-reviewed-v1', JSON.stringify(next)); } catch(e) {}
  }

  var OUT_OF_AREA = {'12477':1,'12498':1,'12143':1,'12453':1,'12480':1,'12495':1}; // Columbia ZIPs removed — now tracked as Columbia County calls
  var resolved = 0, outOfArea = 0, noZip = 0;
  var unresolved = [];
  var multiBox = [];

  // Columbia audit — use shared function
  var _colAuditResult = computeColumbiaAudit(calls, colResolved);

  calls.forEach(function(call) {
    var street = call.address || null;
    var zip = call.zip || null;
    if (!zip && !street) { noZip++; return; }
    if (zip && OUT_OF_AREA[zip] && !borderZipStreetInCounty(street, zip)) { outOfArea++; return; }

    // Columbia County calls counted separately
    if (zip && columbiaZipSet.has(zip)) {
      if (!call.unmappedArea) {
        var distId = resolveColumbiaDistrict(street, zip, call.locTown);
        if (distId) {
          var dist = colDistrictLookup[distId];
          if (dist && !dist.generic) resolved++;
        }
      }
      return;
    }

    var streetClean = street || null;
    if (typeof matchAddressToBoxesSafe === 'undefined') return;
    var result = matchAddressToBoxesSafe(streetClean, zip, null);
    if (result.method === 'unknown') { noZip++; return; }
    if (result.unresolved && result.unmatchedStreet) {
      unresolved.push({ street: result.unmatchedStreet, zip: zip });
    } else if (result.boxIds && result.boxIds.length >= 2) {
      multiBox.push({
        street: streetClean,
        zip: zip,
        boxes: result.boxIds,
        boxKey: result.boxIds.join('/'),
      });
      resolved++;
    } else {
      resolved++;
    }
  });

  // Use shared Columbia audit results
  var colUnresolvedRows = _colAuditResult.unresolvedRows;
  var _worklist = computeMappingWorklist(calls);
  var colZipRows = _colAuditResult.colZipRows;
  // Resolved rows (for the "show resolved" footer)
  var colResolvedRows = (function(){
    var all = computeColumbiaAudit(calls, null).unresolvedRows;
    return all.filter(function(r){ return !!colResolved[(r.street||'')+'||'+(r.zip||'')]; });
  })();

  // Group unresolved
  var unresolvedGroups = {};
  unresolved.forEach(function(u) {
    var k = (u.street||'') + '||' + (u.zip||'');
    if (!unresolvedGroups[k]) unresolvedGroups[k] = { street: u.street, zip: u.zip, count: 0 };
    unresolvedGroups[k].count++;
  });
  var unresolvedRows = Object.values(unresolvedGroups)
    .sort(function(a,b){ return b.count - a.count; });

  // Group multi-box
  var multiGroups = {};
  multiBox.forEach(function(u) {
    var k = (u.street||'') + '||' + (u.zip||'') + '||' + u.boxKey;
    if (!multiGroups[k]) {
      multiGroups[k] = {
        street: u.street, zip: u.zip,
        boxes: u.boxes, boxKey: u.boxKey,
        boxCount: u.boxes.length, count: 0,
        reviewKey: k,
      };
    }
    multiGroups[k].count++;
  });
  var multiRows = Object.values(multiGroups)
    .sort(function(a,b){
      if (b.boxCount !== a.boxCount) return b.boxCount - a.boxCount;
      return b.count - a.count;
    });

  var activeMulti = multiRows.filter(function(r){ return !reviewed[r.reviewKey]; });
  var reviewedMulti = multiRows.filter(function(r){ return !!reviewed[r.reviewKey]; });

  var total = calls.length;
  var matchPct = total > 0 ? Math.round(resolved / total * 100) : 0;

  function doCopy() {
    var out = 'GCDES ADDRESS AUDIT -- ' + total + ' calls\n';
    out += 'Match rate: ' + matchPct + '% (' + resolved + ' resolved, ' + unresolvedRows.length + ' unresolved streets)\n';
    out += 'Out of area: ' + outOfArea + '  No ZIP: ' + noZip + '  Columbia unassigned: ' + colUnresolvedRows.length + ' ('+colResolvedRows.length+' resolved)\n\n';
    if (activeMulti.length > 0) {
      out += 'MULTI-BOX HITS (needs review):\n';
      activeMulti.forEach(function(r) {
        out += '  [' + r.boxCount + ' boxes] ' + (r.street||'?') + '   ZIP:' + (r.zip||'?') + '   boxes:' + r.boxKey + '   x' + r.count + '\n';
      });
      out += '\n';
    }
    if (reviewedMulti.length > 0) {
      out += 'MULTI-BOX REVIEWED (confirmed acceptable):\n';
      reviewedMulti.forEach(function(r) {
        out += '  [' + r.boxCount + ' boxes] ' + (r.street||'?') + '   ZIP:' + (r.zip||'?') + '   boxes:' + r.boxKey + '   x' + r.count + '\n';
      });
      out += '\n';
    }
    if (unresolvedRows.length > 0) {
      out += 'UNRESOLVED STREETS (need box definitions):\n';
      unresolvedRows.forEach(function(r) {
        out += '  ' + (r.street||'(blank)') + '   ZIP:' + (r.zip||'?') + '  x' + r.count + '\n';
      });
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(out).then(function() {
        setAuditCopied(true);
        setTimeout(function(){ setAuditCopied(false); }, 2000);
      });
    }
  }

  function boxBadgeColor(n) {
    return n >= 4 ? '#c0392b' : n === 3 ? '#e67e22' : '#f39c12';
  }

  return (
    <div style={{maxWidth:940,margin:'0 auto',padding:'14px 12px'}}>

      {/* Header */}
      <div style={{background:'white',borderRadius:10,padding:'14px 16px',marginBottom:12,
        border:'2px solid #8e44ad',boxShadow:'0 2px 8px rgba(0,0,0,0.07)'}}>
        <div style={{display:'flex',alignItems:'center',marginBottom:10}}>
          <div style={{fontSize:16,fontWeight:700,color:'#8e44ad',flex:1}}>Address Audit</div>
          <button onClick={doCopy}
            style={{fontSize:11,padding:'4px 12px',borderRadius:5,cursor:'pointer',fontWeight:600,
              border:'1px solid #8e44ad',
              background:auditCopied ? '#8e44ad' : 'transparent',
              color:auditCopied ? 'white' : '#8e44ad'}}>
            {auditCopied ? 'Copied!' : 'Copy Report'}
          </button>
        </div>
        <div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:'#27ae60'}}>{resolved}</div>
            <div style={{fontSize:11,color:'#666'}}>Matched</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:'#f39c12'}}>{activeMulti.length}</div>
            <div style={{fontSize:11,color:'#666'}}>Multi-box review</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:'#e67e22'}}>{unresolvedRows.length}</div>
            <div style={{fontSize:11,color:'#666'}}>Unresolved</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:'#7f8c8d'}}>{outOfArea}</div>
            <div style={{fontSize:11,color:'#666'}}>Out of area</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:'#c0392b'}}>{noZip}</div>
            <div style={{fontSize:11,color:'#666'}}>No ZIP</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:'#2980b9'}}>{matchPct}%</div>
            <div style={{fontSize:11,color:'#666'}}>Match rate</div>
          </div>
        </div>
      </div>

      {/* Multi-box active */}
      {activeMulti.length > 0 && (
        <div style={{background:'white',borderRadius:9,border:'1px solid #f39c12',
          overflow:'hidden',marginBottom:8}}>
          <div style={{padding:'10px 14px',borderBottom:'2px solid #fef3d0',fontSize:13,
            fontWeight:700,color:'#e67e22'}}>
            Multi-Box Hits -- Needs Review ({activeMulti.length} unique)
          </div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'#fefaf0',borderBottom:'1px solid #fef3d0',textAlign:'left'}}>
                <th style={{padding:'6px 12px',color:'#555'}}>Street</th>
                <th style={{padding:'6px 12px',color:'#555'}}>ZIP</th>
                <th style={{padding:'6px 12px',color:'#555'}}>Boxes</th>
                <th style={{padding:'6px 12px',color:'#555',textAlign:'center'}}>Calls</th>
                <th style={{padding:'6px 12px',color:'#555'}}></th>
              </tr>
            </thead>
            <tbody>
              {activeMulti.map(function(r, i) {
                var bc = boxBadgeColor(r.boxCount);
                return (
                  <tr key={i} style={{borderBottom:'1px solid #f0f0f0',
                    background:i%2===0?'#fefdf8':'white'}}>
                    <td style={{padding:'5px 12px',fontWeight:600}}>{r.street || '(blank)'}</td>
                    <td style={{padding:'5px 12px',color:'#555'}}>{r.zip || '?'}</td>
                    <td style={{padding:'5px 12px'}}>
                      <span style={{background:bc,color:'white',borderRadius:4,
                        padding:'1px 6px',fontSize:10,fontWeight:700,marginRight:5}}>
                        {r.boxCount}
                      </span>
                      <span style={{color:'#888',fontSize:11}}>{r.boxKey}</span>
                    </td>
                    <td style={{padding:'5px 12px',textAlign:'center'}}>
                      <span style={{background:'#95a5a6',color:'white',borderRadius:10,
                        padding:'1px 8px',fontSize:11,fontWeight:700}}>{r.count}</span>
                    </td>
                    <td style={{padding:'5px 12px'}}>
                      <button onClick={function(){ markReviewed(r.reviewKey); }}
                        style={{fontSize:10,padding:'2px 8px',borderRadius:4,cursor:'pointer',
                          border:'1px solid #27ae60',background:'transparent',color:'#27ae60',
                          fontWeight:600}}>
                        Mark OK
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Multi-box reviewed */}
      {reviewedMulti.length > 0 && (
        <div style={{background:'white',borderRadius:9,border:'1px solid #ddd',
          overflow:'hidden',marginBottom:8}}>
          <div style={{padding:'8px 14px',borderBottom:'1px solid #eee',
            display:'flex',alignItems:'center',cursor:'pointer'}}
            onClick={function(){ setShowReviewed(!showReviewed); }}>
            <div style={{fontSize:12,fontWeight:700,color:'#27ae60',flex:1}}>
              Reviewed Multi-Box ({reviewedMulti.length}) -- confirmed acceptable
            </div>
            <span style={{fontSize:11,color:'#888'}}>{showReviewed ? 'hide' : 'show'}</span>
          </div>
          {showReviewed && (
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <tbody>
                {reviewedMulti.map(function(r, i) {
                  return (
                    <tr key={i} style={{borderBottom:'1px solid #f0f0f0',
                      background:i%2===0?'#f9fdf9':'white'}}>
                      <td style={{padding:'5px 12px',color:'#555'}}>{r.street || '(blank)'}</td>
                      <td style={{padding:'5px 12px',color:'#888'}}>{r.zip || '?'}</td>
                      <td style={{padding:'5px 12px',color:'#888',fontSize:11}}>{r.boxKey}</td>
                      <td style={{padding:'5px 12px',color:'#888',fontSize:11}}>x{r.count}</td>
                      <td style={{padding:'5px 12px'}}>
                        <button onClick={function(){ unmarkReviewed(r.reviewKey); }}
                          style={{fontSize:10,padding:'2px 8px',borderRadius:4,cursor:'pointer',
                            border:'1px solid #e74c3c',background:'transparent',color:'#e74c3c',
                            fontWeight:600}}>
                          Unreview
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      )}

      {/* Unresolved streets */}
      {unresolvedRows.length > 0 && (
        <div style={{background:'white',borderRadius:9,border:'1px solid #ddd',
          overflow:'hidden',marginBottom:8}}>
          <div style={{padding:'10px 14px',borderBottom:'2px solid #eee',fontSize:13,
            fontWeight:700,color:'#e67e22'}}>
            Unresolved Streets ({unresolvedRows.length})
          </div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'#fafafa',borderBottom:'1px solid #eee',textAlign:'left'}}>
                <th style={{padding:'6px 12px',color:'#555'}}>Street</th>
                <th style={{padding:'6px 12px',color:'#555'}}>ZIP</th>
                <th style={{padding:'6px 12px',color:'#555',textAlign:'center'}}>Calls</th>
              </tr>
            </thead>
            <tbody>
              {unresolvedRows.map(function(r, i) {
                var badge = r.count >= 5 ? '#c0392b' : r.count >= 3 ? '#e67e22' : r.count >= 2 ? '#f39c12' : '#95a5a6';
                return (
                  <tr key={i} style={{borderBottom:'1px solid #f0f0f0',
                    background:i%2===0?'#fafafa':'white'}}>
                    <td style={{padding:'5px 12px',fontWeight:600}}>{r.street || '(blank)'}</td>
                    <td style={{padding:'5px 12px',color:'#555'}}>{r.zip || '?'}</td>
                    <td style={{padding:'5px 12px',textAlign:'center'}}>
                      <span style={{background:badge,color:'white',borderRadius:10,
                        padding:'1px 8px',fontSize:11,fontWeight:700}}>{r.count}</span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Columbia County ZIP volume — expansion roadmap */}
      {colZipRows.length > 0 && (
        <div style={{background:'white',borderRadius:9,border:'1px solid #1a4a8a',
          overflow:'hidden',marginBottom:8}}>
          <div style={{padding:'10px 14px',borderBottom:'2px solid #dce8f8',fontSize:13,
            fontWeight:700,color:'#1a4a8a'}}>
            🔷 Columbia County — Call Volume by ZIP
          </div>
          {colZipRows.map(function(r, i) {
            var statusColor = r.isComplete ? '#27ae60' : r.hasMappedDistricts ? '#e67e22' : '#c0392b';
            var statusLabel = r.isComplete ? '✓ Complete' : r.hasMappedDistricts ? 'In progress' : 'Unmapped';
            return (
              <div key={r.zip} style={{padding:'7px 14px',borderBottom:'1px solid #f0f4fa',
                display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                <span style={{fontWeight:700,fontSize:13,color:'#1a4a8a',minWidth:50}}>{r.zip}</span>
                <span style={{fontSize:12,color:'#333',flex:1}}>{r.place}</span>
                <span style={{fontSize:11,color:statusColor,fontWeight:600,
                  background:statusColor+'18',borderRadius:4,padding:'2px 7px'}}>
                  {statusLabel}
                </span>
                <span style={{fontSize:13,fontWeight:800,color:'#1a2744',minWidth:28,textAlign:'right'}}>
                  {r.count}
                </span>
              </div>
            );
          })}
        </div>
      )}

      {/* Columbia County district call volume */}
      {(function(){
        var distCounts = {};
        calls.forEach(function(c){
          if (!c.zip || !columbiaZipSet.has(c.zip)) return;
          var did = resolveColumbiaDistrict(c.address||'', c.zip, c.locTown);
          if (!did) return;
          var dist = colDistrictLookup[did];
          if (!dist || dist.generic) return; // skip generic
          distCounts[did] = (distCounts[did]||0) + 1;
        });
        var distRows = Object.keys(distCounts)
          .sort(function(a,b){ return distCounts[b]-distCounts[a]; })
          .map(function(did){
            var dist = colDistrictLookup[did];
            return {id:did, label:dist?dist.label:did, municipality:dist?dist.municipality:'', count:distCounts[did]};
          });
        if (distRows.length === 0) return null;
        return (
          <div style={{background:'white',borderRadius:9,border:'1px solid #1a4a8a',
            overflow:'hidden',marginBottom:8}}>
            <div style={{padding:'10px 14px',borderBottom:'2px solid #dce8f8',fontSize:13,
              fontWeight:700,color:'#1a4a8a'}}>
              🔷 Columbia County — District Call Volume ({distRows.length} districts)
            </div>
            {distRows.map(function(r) {
              return (
                <div key={r.id} style={{padding:'6px 14px',borderBottom:'1px solid #f0f4fa',
                  display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontWeight:700,fontSize:12,color:'#1a4a8a',minWidth:40}}>{r.id}</span>
                  <span style={{fontSize:12,color:'#333',flex:1}}>{r.label}</span>
                  <span style={{fontSize:11,color:'#888'}}>{r.municipality}</span>
                  <span style={{fontSize:13,fontWeight:800,color:'#1a2744',minWidth:28,textAlign:'right'}}>
                    {r.count}
                  </span>
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* Two-tier mapping worklist — map next, worst first */}
      {(function(){
        var wl = _worklist;
        var sections = [
          {key:'greene',   label:'Greene County',   color:'#1a7a3a'},
          {key:'columbia', label:'Columbia County', color:'#1a4a8a'}
        ];
        var any = sections.some(function(s){ return wl[s.key].towns.length || wl[s.key].streets.length; });
        if (!any) return null;
        return (
          <div style={{background:'white',borderRadius:9,border:'2px solid #b9770e',
            overflow:'hidden',marginBottom:8}}>
            <div style={{padding:'10px 14px',borderBottom:'2px solid #ffe0a3',fontSize:13,
              fontWeight:700,color:'#b9770e'}}>
              🗺️ Mapping Worklist — map next, worst first
            </div>
            {sections.map(function(s){
              var d = wl[s.key];
              if (!d.towns.length && !d.streets.length) return null;
              return (
                <div key={s.key} style={{padding:'10px 14px',borderTop:'1px solid #f3e3c3'}}>
                  <div style={{fontSize:12,fontWeight:700,color:s.color,marginBottom:6}}>{s.label}</div>
                  {d.towns.length>0 && (
                    <div style={{marginBottom:d.streets.length>0?8:0}}>
                      <div style={{fontSize:10,fontWeight:700,color:'#aaa',textTransform:'uppercase',
                        letterSpacing:0.5,marginBottom:3}}>Towns to map ({d.towns.length})</div>
                      {d.towns.slice(0,12).map(function(t){
                        return (<div key={t.town} style={{display:'flex',justifyContent:'space-between',
                          fontSize:12,padding:'2px 0'}}>
                          <span style={{color:'#444'}}>{t.town}</span>
                          <span style={{fontWeight:700,color:'#b9770e'}}>{t.count} calls</span>
                        </div>);
                      })}
                    </div>
                  )}
                  {d.streets.length>0 && (
                    <div>
                      <div style={{fontSize:10,fontWeight:700,color:'#aaa',textTransform:'uppercase',
                        letterSpacing:0.5,marginBottom:3}}>Streets to map in mapped towns ({d.streets.length})</div>
                      {d.streets.slice(0,15).map(function(r,i){
                        return (<div key={i} style={{display:'flex',justifyContent:'space-between',
                          fontSize:12,padding:'2px 0'}}>
                          <span style={{color:'#444'}}>{r.street} <span style={{color:'#999',fontSize:10}}>· {r.town} {r.zip}</span></span>
                          <span style={{fontWeight:700,color:s.color}}>×{r.count}</span>
                        </div>);
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* Columbia County unresolved / generic district calls */}
      {colUnresolvedRows.length > 0 && (
        <div style={{background:'white',borderRadius:9,border:'1px solid #1a4a8a',
          overflow:'hidden',marginBottom:8}}>
          <div style={{padding:'10px 14px',borderBottom:'2px solid #dce8f8',fontSize:13,
            fontWeight:700,color:'#1a4a8a'}}>
            🔷 Columbia County — Unassigned / Generic District ({colUnresolvedRows.length} unique)
          </div>
          {colUnresolvedRows.map(function(r, i) {
            var zipInfo = columbiaZipLookup[r.zip];
            var rKey = (r.street||'')+'||'+(r.zip||'');
            return (
              <div key={i} style={{padding:'7px 14px',borderBottom:'1px solid #f0f4fa',
                display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                <span style={{fontFamily:'monospace',fontSize:12,flex:1,color:'#333',fontWeight:600}}>
                  {r.street || '(no address)'}
                </span>
                <span style={{fontSize:11,color:'#666',background:'#f0f4fa',
                  borderRadius:4,padding:'2px 6px'}}>
                  {r.zip}{zipInfo ? ' · ' + zipInfo.place : ''}
                </span>
                <span style={{fontSize:12,fontWeight:800,color:'#1a4a8a',minWidth:28,textAlign:'right'}}>
                  ×{r.count}
                </span>
                <button onClick={function(){markColResolved(rKey);}}
                  style={{padding:'2px 8px',borderRadius:4,border:'1px solid #27ae60',
                    background:'white',color:'#27ae60',fontSize:10,fontWeight:700,cursor:'pointer',
                    whiteSpace:'nowrap'}}>
                  ✓ Resolved
                </button>
              </div>
            );
          })}
          {colResolvedRows.length > 0 && (
            <div style={{padding:'6px 14px',borderTop:'2px solid #f0f4fa'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                <button onClick={function(){setColResolved({});
                  try{localStorage.removeItem('gcdes-col-resolved-v1');}catch(e){}}}
                  style={{fontSize:10,color:'#888',background:'none',border:'none',cursor:'pointer',padding:0}}>
                  ↺ Clear all resolved
                </button>
              </div>
              {colResolvedRows.map(function(r,i){
                var rKey = (r.street||'')+'||'+(r.zip||'');
                var zipInfo = columbiaZipLookup[r.zip];
                return (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:8,
                    padding:'4px 0',borderBottom:'1px solid #f5f5f5',opacity:0.7}}>
                    <span style={{fontFamily:'monospace',fontSize:11,flex:1,color:'#666'}}>
                      {r.street||'(no address)'}
                    </span>
                    <span style={{fontSize:10,color:'#888'}}>
                      {r.zip}{zipInfo?' · '+zipInfo.place:''}
                    </span>
                    <span style={{fontSize:11,color:'#999',minWidth:24,textAlign:'right'}}>×{r.count}</span>
                    <button onClick={function(){unmarkColResolved(rKey);}}
                      style={{padding:'1px 6px',borderRadius:4,border:'1px solid #e0e0e0',
                        background:'white',color:'#e67e22',fontSize:9,fontWeight:700,cursor:'pointer'}}>
                      ↺
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {unresolvedRows.length === 0 && activeMulti.length === 0 && colUnresolvedRows.length === 0 && total > 0 && (
        <div style={{padding:'40px',textAlign:'center',color:'#27ae60',fontSize:15,fontWeight:700,
          background:'white',borderRadius:10,border:'2px solid #27ae60'}}>
          All {total} calls resolved and reviewed.
        </div>
      )}
      {total === 0 && (
        <div style={{padding:'40px',textAlign:'center',color:'#888',background:'white',
          borderRadius:10,border:'1px solid #ddd'}}>
          No calls logged yet.
        </div>
      )}

      {/* Box Call Volume */}
      {(function(){
        // Tally calls per box from stored boxIds (includes backfilled records)
        var boxCounts = {};
        calls.forEach(function(c){
          if (!c.boxIds || c.boxIds.length === 0) return;
          c.boxIds.forEach(function(bid){
            boxCounts[bid] = (boxCounts[bid]||0) + 1;
          });
        });
        var boxRows = Object.keys(boxCounts).map(function(bid){
          var box = (typeof GCDES_BOXES !== 'undefined') ? GCDES_BOXES.find(function(b){ return b.id===bid; }) : null;
          return {
            id: bid,
            name: box ? box.name : '(unknown)',
            battalion: box ? (box.battalion || 'TBD') : '?',
            speedProfile: box ? (box.speedProfile||'rural') : 'rural',
            count: boxCounts[bid],
          };
        }).sort(function(a,b){ return b.count - a.count; });
        if (boxRows.length === 0) return null;
        var maxCount = boxRows[0].count;
        function heatColor(n) {
          if (n >= maxCount * 0.75) return '#c0392b';
          if (n >= maxCount * 0.50) return '#e67e22';
          if (n >= maxCount * 0.25) return '#f39c12';
          return '#95a5a6';
        }
        return (
          <div style={{background:'white',borderRadius:9,border:'1px solid #2980b9',
            overflow:'hidden',marginTop:8}}>
            <div style={{padding:'10px 14px',borderBottom:'2px solid #d6eaf8',fontSize:13,
              fontWeight:700,color:'#2980b9'}}>
              Box Call Volume ({boxRows.length} boxes with activity)
            </div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'#eaf4fb',borderBottom:'1px solid #d6eaf8',textAlign:'left'}}>
                  <th style={{padding:'6px 12px',color:'#555'}}>Box</th>
                  <th style={{padding:'6px 12px',color:'#555'}}>Name</th>
                  <th style={{padding:'6px 12px',color:'#555'}}>Battalion</th>
                  <th style={{padding:'6px 12px',color:'#555'}}>Profile</th>
                  <th style={{padding:'6px 12px',color:'#555',textAlign:'center'}}>Calls</th>
                </tr>
              </thead>
              <tbody>
                {boxRows.map(function(r,i){
                  return (
                    <tr key={r.id} style={{borderBottom:'1px solid #f0f0f0',
                      background:i%2===0?'#f7fbff':'white'}}>
                      <td style={{padding:'5px 12px',fontFamily:'monospace',fontWeight:700,color:'#2980b9'}}>{r.id}</td>
                      <td style={{padding:'5px 12px',fontWeight:600}}>{r.name}</td>
                      <td style={{padding:'5px 12px',color:'#555'}}>{r.battalion}</td>
                      <td style={{padding:'5px 12px',color:'#888',fontSize:11}}>{r.speedProfile}</td>
                      <td style={{padding:'5px 12px',textAlign:'center'}}>
                        <span style={{background:heatColor(r.count),color:'white',borderRadius:10,
                          padding:'1px 8px',fontSize:11,fontWeight:700}}>{r.count}</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      })()}
    </div>
  );
}


// ── Columbia Build Recommendations (run-card driven) ─────────────────────────
function buildColumbiaRecs(calls, checked) {
  var colCalls = calls.filter(function(c){ return c.zip && columbiaZipSet.has(c.zip); });
  if (colCalls.length < 5) return []; // not enough data yet

                    <div style={{color:'#bbb',marginTop:3}}>{c.timestamp}{c.updatedAt?' (updated '+c.updatedAt+')':''}</div>

}


function RunTab(props) { var allNeeds=props.allNeeds,sessions=props.sessions,DEPT_META=props.DEPT_META,isAcademyBusy=props.isAcademyBusy,getAvailableAcademy=props.getAvailableAcademy,completeSession=props.completeSession,cancelSession=props.cancelSession,startSession=props.startSession,toggleEnrollMember=props.toggleEnrollMember;
  var runnable = allNeeds.filter(function(n){

  });
  var running = [];

                  <span style={{fontSize:11,color:'#888'}}>🏫 {ac.name.split(' ').slice(0,3).join(' ')}</span>

                    <button onClick={function(){cancelSession(ac.id,course.id);}}

                        borderRadius:5,cursor:'pointer',fontSize:12}}>✕ Cancel</button>
                  </div>
                  {needObj && needObj.members.length > 0 && (
                    <div style={{marginTop:8}}>
                      <div style={{fontSize:11,color:'#555',fontWeight:600,marginBottom:5}}>
                        Enroll students ({enrolledCount} enrolled):
                      </div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                        {needObj.members.map(function(mem) {
                          var ek = 'enroll::'+ac.id+'::'+course.id+'::'+mem.trainedKey;
                          var isEnrolled = !!sessions[ek];
                          var inOther = !isEnrolled && Object.keys(sessions).some(function(k){
                            return k.startsWith('enroll::') && k.endsWith('::'+mem.trainedKey) && k !== ek;
                          });
                          return (
                            <div key={mem.trainedKey}

                                border:'1px solid '+(isEnrolled?'#27ae60':inOther?'#ccc':'#aaa'),

                          );

                      </div>
                    </div>
                  )}
                  {(!needObj || needObj.members.length === 0) && (
                    <div style={{fontSize:11,color:'#888',marginTop:4}}>No eligible members found.</div>

                </div>
              </div>

          {runnable.map(function(_o) {

                      border:'none',borderRadius:5,cursor:'pointer',fontSize:12,fontWeight:700}}>
                    ▶ Start Class</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


function TrainingTab(props) { var checked=props.checked,trained=props.trained,sessions=props.sessions,setTrained=props.setTrained,setSessions=props.setSessions,trainingTab=props.trainingTab,setTrainingTab=props.setTrainingTab,now=props.now;


        const startSession  = (acId, cId) => setSessions(p=>({...p,
          [courseSessionKey(acId,cId)]:true,[courseStartTimeKey(acId,cId)]:Date.now()}));

        const completeSession = (acId, cId) => {
          const ep = `enroll::${acId}::${cId}::`;
          const enrolled = Object.keys(sessions).filter(k=>k.startsWith(ep));
          setTrained(p=>{ const n={...p}; enrolled.forEach(ek=>{n[ek.replace(ep,'')]=true;}); return n; });
          setSessions(p=>{ const n={...p}; delete n[courseSessionKey(acId,cId)]; delete n[courseStartTimeKey(acId,cId)];
            Object.keys(n).filter(k=>k.startsWith(ep)).forEach(k=>delete n[k]);
            n[courseCompleteKey(acId,cId)]=(n[courseCompleteKey(acId,cId)]||0)+1; return n; });
        };

        const cancelSession = (acId, cId) => setSessions(p=>{
          const n={...p}; delete n[courseSessionKey(acId,cId)]; delete n[courseStartTimeKey(acId,cId)];
          Object.keys(n).filter(k=>k.startsWith(`enroll::${acId}::${cId}::`)).forEach(k=>delete n[k]); return n; });

        const toggleEnrollMember = (acId, cId, tkey, enrolledCount) => {
          const ek = courseEnrollKey(acId,cId,tkey);
          const inOther = Object.keys(sessions).some(k=>k.startsWith('enroll::')&&k.endsWith(`::${tkey}`)&&k!==ek);
          if(inOther) return;
          setSessions(p=>{ const n={...p}; if(n[ek]){delete n[ek];}else if(enrolledCount<10){n[ek]=true;} return n; });
        };

        const DEPT_META = {
          fire:{color:'#c0392b',label:'FD', academies:FIRE_ACADEMIES,courses:FIRE_COURSES,
            getMem:(cid)=>{ const r=[];
              for(const st of FIRE_STATIONS){for(const u of st.units){
                const sc=unitStaff(u.id, u.type)||0; if(!sc) continue;
                if(!checked[unitId('fire',st.id,u.id)]) continue;

                  if(!trained[tk]) r.push({stationName:st.name,unitId:u.id,memberName:name,trainedKey:tk}); });
              }} return r; }},
          pd:{color:'#1565c0',label:'PD', academies:PD_ACADEMIES,courses:PD_COURSES,
            getMem:(cid)=>{ const r=[];
              for(const st of [...PD_PRECINCTS,...PD_OUTPOSTS]){for(const u of st.units){

                if(!checked[unitId('pd',st.id,u.id)]) continue;
                if(!getPDUnitCourseIds(u.id,u.type).includes(cid)) continue;

                  if(!trained[tk]) r.push({stationName:st.name,unitId:u.id,memberName:name,trainedKey:tk}); });
              }} return r; }},
          ems:{color:'#e67e22',label:'EMS',academies:EMS_ACADEMIES,courses:EMS_COURSES,
            getMem:(cid)=>{ const r=[];
              for(const st of EMS_STATIONS){for(const u of st.units){
                const sc=unitStaff(u.id, u.type)||0; if(!sc) continue;
                if(!checked[unitId('ems',st.id,u.id)]) continue;
                if(!getEMSUnitCourseIds(u.type,st).includes(cid)) continue;

                  if(!trained[tk]) r.push({stationName:st.name,unitId:u.id,memberName:name,trainedKey:tk}); });
              }}
              // Mountain courses: units sit in FIRE_STATIONS mountain houses, trained at EMS academy
              if(cid===deptCourseId('ems','mountain-rescue')||cid===deptCourseId('ems','mountain-dog')){
                for(const st of FIRE_STATIONS){ if(st.type!=='mountain') continue; for(const u of st.units){
                  const sc=unitStaff(u.id, u.type)||0; if(!sc) continue;
                  if(!checked[unitId('fire',st.id,u.id)]) continue;
                  if(!getEMSUnitCourseIds(u.type,st).includes(cid)) continue;
                  getMemberNames(sc).forEach(name=>{ const tk=memberTrainedKey('ems',st.id,u.id,name,cid);
                    if(!trained[tk]) r.push({stationName:st.name,unitId:u.id,memberName:name,trainedKey:tk}); });
                }}
              }
              return r; }},
        };

        const isAcademyBusy = (dept) => DEPT_META[dept].academies.every(ac=>

  function exportColumbiaRunCards(townFilter) {
    try {
      var colCalls = calls.filter(function(c){ return c.zip && columbiaZipSet.has(c.zip); });
      function fmt(s){ if(s==null||!isFinite(s)) return '—'; var m=Math.floor(s/60),x=Math.round(s%60); return m+':'+(x<10?'0':'')+x; }
      // unit id -> type (both counties), for alarm-slot eligibility
      var typeMap = {};
      [].concat(FIRE_STATIONS, EMS_STATIONS, PD_PRECINCTS, PD_OUTPOSTS,
               COL_FIRE_STATIONS, COL_EMS_STATIONS, COL_PD_PRECINCTS, COL_PD_OUTPOSTS)
        .forEach(function(s){ (s.units||[]).forEach(function(u){ typeMap[u.id]=u.type; }); });

      // Aggregate responders per district from resolved Columbia calls
      var rcByDist = {};
      colCalls.forEach(function(c){
        var did = resolveColumbiaDistrict(c.address||'', c.zip, c.locTown);
        if (!did) return;
        var dist = colDistrictLookup[did];
        if (!dist || dist.generic) return;
        if (!rcByDist[did]) rcByDist[did] = {count:0, units:{}};
        rcByDist[did].count++;
        (c.assignedUnits||[]).forEach(function(au){
          var uid = au.uid || au.unitId; if (!uid) return;
          if (au.responseTimeSecs == null) return;
          if (au.response === 'Upon Completion' || au.response === 'Mutual Aid' || au.response === 'Staffing') return;
          var ooc = !COL_UNIT_ID_SET.has(uid);
          var U = rcByDist[did].units;
          if (!U[uid]) U[uid] = {uid:uid, type:typeMap[uid]||'', count:0, rawTotal:0, ooc:ooc};
          U[uid].count++; U[uid].rawTotal += au.responseTimeSecs;
        });
      });

      function rankUnits(distRec){
        return Object.keys(distRec.units).map(function(k){
          var u = distRec.units[k];
          u.rawAvg = u.rawTotal/u.count;
          u.adjAvg = u.rawAvg + (u.ooc?900:0);
          return u;
        }).sort(function(a,b){ return a.adjAvg-b.adjAvg; });
      }
      function draftAlarm(ranked){
        var used = {};
        return ALARM_SLOTS.map(function(slot){
          var pick = null;
          if (slot.prefer) {
            for (var p=0;p<ranked.length;p++){ var up=ranked[p];
              if (used[up.uid]) continue;
              if (up.type === slot.prefer) { pick=up; break; }
            }
          }
          if (!pick) for (var i=0;i<ranked.length;i++){ var u=ranked[i];
            if (used[u.uid]) continue;
            if (slot.types.indexOf(u.type) >= 0) { pick=u; break; }
          }
          if (pick) used[pick.uid] = true;
          return {lvl:slot.lvl, role:slot.role, unit:pick};

      }
      function alarmRoleLines(assign, lvl){
        var slots = assign.filter(function(s){ return s.lvl===lvl; });
        var order=[], byRole={};
        slots.forEach(function(s){ if(!byRole[s.role]){byRole[s.role]=[]; order.push(s.role);} byRole[s.role].push(s); });
        return order.map(function(role){
          var picks = byRole[role].map(function(s){
            return s.unit ? s.unit.uid+' ('+fmt(s.unit.adjAvg)+(s.unit.ooc?' MA':'')+')' : '— unfilled —';
          });
          return '    '+role+': '+picks.join(', ');
        });
      }

      // Group districts by town
      var townMap = {};
      Object.keys(rcByDist).forEach(function(did){
        var dist = colDistrictLookup[did];
        var muni = dist.municipality||'?';
        if (!townMap[muni]) townMap[muni] = {total:0, dists:[]};
        townMap[muni].total += rcByDist[did].count;
        townMap[muni].dists.push({id:did, label:dist.label, rec:rcByDist[did]});
      });

      var _townKeys = Object.keys(townMap).sort(function(a,b){ return townMap[b].total-townMap[a].total; });
      if (townFilter) _townKeys = _townKeys.filter(function(m){ return m === townFilter; });
      var _hdr = townFilter
        ? '=== COLUMBIA RUN CARD — '+townFilter.toUpperCase()+' === ('+(townMap[townFilter]?townMap[townFilter].total:0)+' calls)'
        : '=== COLUMBIA RUN CARDS (by town) === ('+colCalls.length+' calls)';
      var lines = [_hdr, 'Times are adjusted (out-of-county +15:00). MA = Greene mutual aid.'];
      if (townFilter && !townMap[townFilter]) lines.push('', '(no calls resolved for '+townFilter+' yet)');
      _townKeys.forEach(function(muni){
        lines.push('');
        lines.push('#### '+muni.toUpperCase()+' — '+townMap[muni].total+' calls ####');
        townMap[muni].dists.sort(function(a,b){ return b.rec.count-a.rec.count; }).forEach(function(d){
          var ranked = rankUnits(d.rec);
          lines.push('');
          lines.push(d.id+' '+d.label+' — '+d.rec.count+' calls');
          lines.push('  Responders (adjusted, fastest first):');
          if (ranked.length === 0) {
            lines.push('    (no timed responders yet)');
          } else {
            ranked.forEach(function(u){
              lines.push('    '+u.uid+': '+(u.ooc ? fmt(u.adjAvg)+' adj (raw '+fmt(u.rawAvg)+')' : fmt(u.adjAvg))+' ×'+u.count+(u.ooc?' [MA]':''));
            });
            var assign = draftAlarm(ranked);
            lines.push('  1st Alarm draft:');
            alarmRoleLines(assign, 0).forEach(function(l){ lines.push(l); });
            lines.push('  All Hands adds:');
            alarmRoleLines(assign, 1).forEach(function(l){ lines.push(l); });
          }
        });
      });

      setExportText(lines.join('\n'));
    } catch(err) {
      setExportText('ERROR: '+err.message+'\n\n'+err.stack);
    }
  }

                    background:tab===t.key?t.color+'dd':'rgba(255,255,255,0.08)',
                    color:tab===t.key?'white':'#aab',borderBottom:tab===t.key?'2px solid '+t.color:'2px solid transparent'}}>

            {county===COUNTY_COLUMBIA && (
              <button onClick={function(){setTab('districts'); setExp({});}}
                style={{padding:'5px 12px',borderRadius:6,border:'none',cursor:'pointer',fontSize:11,fontWeight:600,
                  background:tab==='districts'?'#1a4a8add':'rgba(255,255,255,0.08)',
                  color:tab==='districts'?'white':'#aab',
                  borderBottom:tab==='districts'?'2px solid #1a4a8a':'2px solid transparent'}}>
                🗺️ Districts
              </button>
            )}
            {county===COUNTY_COLUMBIA && (
              <button onClick={function(){setTab('atoms'); setExp({});}}
                style={{padding:'5px 12px',borderRadius:6,border:'none',cursor:'pointer',fontSize:11,fontWeight:600,
                  background:tab==='atoms'?'#1565c0dd':'rgba(255,255,255,0.08)',
                  color:tab==='atoms'?'white':'#aab',
                  borderBottom:tab==='atoms'?'2px solid #1565c0':'2px solid transparent'}}>
                🔵 Atoms
              </button>
            )}
            {county===COUNTY_GREENE && (
              <button onClick={function(){setTab('boxes'); setExp({});}}
                style={{padding:'5px 12px',borderRadius:6,border:'none',cursor:'pointer',fontSize:11,fontWeight:600,
                  background:tab==='boxes'?'#1a6b3cdd':'rgba(255,255,255,0.08)',
                  color:tab==='boxes'?'white':'#aab',
                  borderBottom:tab==='boxes'?'2px solid #1a6b3c':'2px solid transparent'}}>
                🗺️ Boxes
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Districts tab — Columbia County */}
      {tab==='districts' && county===COUNTY_COLUMBIA && (
        <DistrictsTab/>

      {tab==='atoms' && county===COUNTY_COLUMBIA && (
        <AtomsTab/>
      )}
      {tab==='boxes' && county===COUNTY_GREENE && (
        <BoxesTab calls={calls}/>
      )}

      {/* Regional placeholder */}
      {county===COUNTY_REGIONAL && !['recs','training','calllog','audit'].includes(tab) && tab!=='medical' && (
        <div style={{maxWidth:980,margin:'40px auto',padding:'0 16px',textAlign:'center'}}>
          <div style={{background:'white',borderRadius:12,padding:'48px 32px',boxShadow:'0 2px 12px rgba(0,0,0,0.08)'}}>
            <div style={{fontSize:48,marginBottom:16}}>🌐</div>
            <div style={{fontSize:22,fontWeight:800,color:'#6d4c41',marginBottom:8}}>Regional Assets</div>
            <div style={{fontSize:14,color:'#666'}}>
              Use the Medical Facilities tab to view Albany Med, Air Ops Stewart, and Kingston Hospital.
            </div>
          </div>
        </div>
      )}

      {/* Search bar (dept tabs only) */}
      {(county===COUNTY_GREENE||county===COUNTY_COLUMBIA) && !isSpecialColTab && !TABS.find(function(t){return t.key===tab&&t.prominent;}) && tab!=='medical' && (
        <div style={{maxWidth:980,margin:'10px auto 0',padding:'0 12px'}}>
          <input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="Search stations, units, extensions..."
            style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1px solid #ddd',fontSize:13,boxSizing:'border-box',
              boxShadow:'0 1px 4px rgba(0,0,0,0.07)'}}/>
        </div>
      )}

      {/* Export panel */}
      {exportText && (
        <div style={{background:'#1a2744',borderTop:'1px solid #2d3a5a',padding:'10px 16px'}}>
          <div style={{maxWidth:980,margin:'0 auto'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <span style={{fontSize:11,fontWeight:700,color:'#7ecec4'}}>📋 Export — click the box to select all, then copy and paste into chat</span>
              <button onClick={function(){setExportText('');}}
                style={{marginLeft:'auto',fontSize:10,padding:'2px 8px',borderRadius:4,
                  border:'1px solid #8892a4',background:'transparent',color:'#cdd',cursor:'pointer'}}>
                ✕ Close
              </button>
            </div>
            <textarea readOnly value={exportText}
              onClick={function(e){e.target.select();}}
              style={{width:'100%',height:180,fontSize:10,fontFamily:'monospace',
                background:'#0d1526',color:'#a8c0d6',border:'1px solid #2d3a5a',
                borderRadius:5,padding:'8px',resize:'vertical',boxSizing:'border-box'}}/>
          </div>
        </div>
      )}

      {/* PROMINENT TAB CONTENT */}
      {tab === 'recs' && (
        <RecsTab checked={checked} timestamps={timestamps} calls={calls} toggle={toggle} setTimestamps={setTimestamps}/>
      )}
      {tab === 'training' && (
        <TrainingTab checked={checked} trained={trained} sessions={sessions}
          setTrained={setTrained} setSessions={setSessions}
          trainingTab={trainingTab} setTrainingTab={setTrainingTab} now={now}/>
      )}
      {tab === 'calllog' && (
        <CalllogTab calls={calls} setCalls={setCalls}
          callForm={callForm} setCallForm={setCallForm}
          editingCallId={editingCallId} setEditingCallId={setEditingCallId}
          checked={checked}/>
      )}
      {tab === 'audit' && (
        <AuditTab calls={calls}/>
      )}
      {tab === 'medical' && (
        <MedicalTab checked={checked} toggle={toggle}/>
      )}

      {/* STATION TABS — Greene + Columbia share the same rendering logic */}
      {colEmpty && !isSpecialColTab && !TABS.find(function(t){return t.key===tab&&(t.prominent||t.key==='medical');}) && (
        <div style={{textAlign:'center',padding:'48px 0'}}>
          <div style={{fontSize:40,marginBottom:12}}>🔷</div>
          <div style={{fontSize:18,fontWeight:700,color:'#1a4a8a',marginBottom:6}}>Columbia County</div>
          <div style={{fontSize:13,color:'#888'}}>No stations built yet for this department. Add calls and let pressure drive placement.</div>
        </div>
      )}
      {(county===COUNTY_GREENE||county===COUNTY_COLUMBIA) && !isSpecialColTab && !colEmpty && !TABS.find(function(t){return t.key===tab&&(t.prominent||t.key==='medical');}) && (
        <div style={{maxWidth:980,margin:'12px auto',padding:'0 12px'}}>
          {activeGroups.map(function(grp) {
            var filtered = grp.stations.filter(matches);
            if (filtered.length===0) return null;
            return (
              <div key={grp.key+(grp.label||'')} style={{marginBottom:16}}>
                {grp.label && (
                  <div style={{fontSize:13,fontWeight:700,color:'#1a2744',marginBottom:8,
                    padding:'6px 10px',background:'white',borderRadius:7,border:'1px solid #e0e0e0'}}>
                    {grp.label}
                  </div>
                )}
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {filtered.map(function(st) {
                    var sk = grp.key;
                    var done = isDone(sk,st);
                    var cnt = cntDone(sk,st);
                    var tot = cntTot(sk,st);
                    var expKey = 's-'+sk+'-'+st.id;
                    var isOpen = exp[expKey]!==undefined ? exp[expKey] : !done;
                    var tc = sk==='pd' ? pdTypeColor(st) : (TYPE_COLORS[st.type]||TYPE_COLORS.urban);
                    var builtChk = !!checked[stId(sk,st.id)];
                    var extChk   = st.extension ? !!checked[extId(sk,st.id)] : false;
                    var ext2Chk  = st.extension2 ? !!checked[ext2Id(sk,st.id)] : false;
                    var storState = storageRoomState(checked, sk, st);
                    var extColor = EXT_COLORS[st.extension]||'#555';
                    var ext2Color = EXT_COLORS[st.extension2]||'#555';
                    var stLabel  = sk==='pd'
                      ? (st.id==='R' ? 'River Precinct' : (st.command===0 ? st.name : 'P'+st.id+' \u2014 '+st.name))
                      : st.name;
                    var totalCrew = st.units.reduce(function(sum,u){return sum+(unitStaff(u.id, u.type)||0);},0);
                    return (
                      <div key={st.id} style={{background:done?'#f0faf0':'white',
                        border:'2px solid '+(done?'#2ecc71':tc.border),
                        borderRadius:10,marginBottom:7,overflow:'hidden'}}>

                        {/* Station header */}
                        <div style={{background:done?'#e8f8e8':tc.bg,padding:'9px 13px',
                          display:'flex',alignItems:'center',gap:9}}>
                          <label style={{display:'flex',flexDirection:'column',alignItems:'center',
                            gap:1,cursor:'pointer',minWidth:38}}
                            onClick={function(e){e.stopPropagation();}}>
                            <input type="checkbox" checked={builtChk}
                              onChange={function(){toggle(stId(sk,st.id));}}
                              style={{width:17,height:17,cursor:'pointer',accentColor:tc.badge}}/>
                            <span style={{fontSize:8,color:'#888',textAlign:'center',
                              lineHeight:1.1,userSelect:'none'}}>Built</span>
                          </label>

                          <div style={{flex:1,cursor:'pointer',minWidth:0}}
                            onClick={function(){toggleExp(expKey);}}>
                            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                              <span style={{fontWeight:700,fontSize:14,color:'#1a2744'}}>{stLabel}</span>
                              {builtChk && (
                                <span style={{fontSize:10,background:'#27ae60',color:'white',
                                  borderRadius:4,padding:'1px 6px'}}>🏗 Built</span>
                              )}
                            </div>
                            <div style={{fontSize:11,color:'#666',marginTop:1,display:'flex',
                              gap:5,flexWrap:'wrap',alignItems:'center'}}>
                              {st.battalion && <span>{st.battalion}</span>}
                              {st.command>0 && <span>{'CMD'+st.command}</span>}
                              <span style={{background:tc.badge,color:'white',borderRadius:4,
                                padding:'1px 5px',fontSize:10}}>{tc.label}</span>
                              {totalCrew>0 && (
                                <span style={{background:'#1a2744',color:'white',borderRadius:4,
                                  padding:'1px 5px',fontSize:10}}>
                                  👤 {totalCrew}/shift
                                </span>
                              )}
                              {st.extension && (
                                <span style={{background:extChk?extColor:'transparent',
                                  color:extChk?'white':extColor,
                                  border:'1px solid '+extColor,borderRadius:4,
                                  padding:'1px 5px',fontSize:10}}>
                                  {extChk?'\u2713 ':''}{st.extension}
                                  <ExtTimerBadge grpKey={sk} stId={st.id} extension={st.extension} timestamps={timestamps}/>
                                </span>
                              )}
                            </div>
                            {st.address && (
                              <div style={{fontSize:10,color:'#999',marginTop:1}}>{st.address}</div>
                            )}
                          </div>

                          <div style={{display:'flex',alignItems:'center',gap:7,cursor:'pointer'}}
                            onClick={function(){toggleExp(expKey);}}>
                            <div style={{textAlign:'right',minWidth:40}}>
                              <div style={{fontSize:13,fontWeight:700,
                                color:done?'#27ae60':tc.badge}}>{cnt}/{tot}</div>
                              <div style={{fontSize:10,color:'#999'}}>items</div>
                            </div>
                            <div style={{fontSize:16,color:'#bbb',userSelect:'none'}}>
                              {isOpen?'\u25b2':'\u25bc'}
                            </div>
                          </div>
                        </div>

                        {/* Expanded body */}
                        {isOpen && (
                          <div style={{borderTop:'1px solid '+tc.border+'22',padding:'9px 13px 11px'}}>

                            {/* Extension row */}
                            {st.extension && (
                              <label style={{display:'flex',alignItems:'center',gap:9,padding:'7px 11px',
                                marginBottom:9,
                                background:extChk?'#e8f8e8':'#f8f0ff',
                                border:'2px solid '+(extChk?'#2ecc71':extColor),
                                borderRadius:7,cursor:'pointer'}}>
                                <input type="checkbox" checked={extChk}
                                  onChange={function(){toggleExt(extId(sk,st.id),sk,st.id,st.extension);}}
                                  style={{width:15,height:15,accentColor:extColor,cursor:'pointer'}}/>
                                <div style={{flex:1}}>
                                  <div style={{fontSize:13,fontWeight:700,
                                    color:extChk?'#27ae60':extColor,
                                    textDecoration:extChk?'line-through':'none'}}>
                                    {sk==='pd'?'Specialized Unit / Capability \u2014 ':'Extension Bay \u2014 '}{st.extension}
                                    <ExtTimerBadge grpKey={sk} stId={st.id} extension={st.extension} timestamps={timestamps}/>
                                  </div>
                                  <div style={{fontSize:11,color:'#888'}}>
                                    {sk==='pd'?'Special capability assigned to this precinct':'Physical extension structure'}
                                    {' \u2014 '}${(extCost(st.extension, sk)/1000).toFixed(0)}k
                                  </div>
                                </div>
                                <span style={{background:extColor,color:'white',borderRadius:4,
                                  padding:'2px 7px',fontSize:11,fontWeight:600}}>
                                  {sk==='pd'?'SPEC':'EXT'}
                                </span>
                                {extChk && <span>&#10003;</span>}
                              </label>
                            )}

                            {/* Second extension row — "large" stations only */}
                            {st.extension2 && (
                              <label style={{display:'flex',alignItems:'center',gap:9,padding:'7px 11px',
                                marginBottom:9,
                                background:ext2Chk?'#e8f8e8':'#f8f0ff',
                                border:'2px solid '+(ext2Chk?'#2ecc71':ext2Color),
                                borderRadius:7,cursor:'pointer'}}>
                                <input type="checkbox" checked={ext2Chk}
                                  onChange={function(){toggleExt(ext2Id(sk,st.id),sk,st.id,st.extension2);}}
                                  style={{width:15,height:15,accentColor:ext2Color,cursor:'pointer'}}/>
                                <div style={{flex:1}}>
                                  <div style={{fontSize:13,fontWeight:700,
                                    color:ext2Chk?'#27ae60':ext2Color,
                                    textDecoration:ext2Chk?'line-through':'none'}}>
                                    {sk==='pd'?'Specialized Unit / Capability \u2014 ':'Extension Bay \u2014 '}{st.extension2}
                                  </div>
                                  <div style={{fontSize:11,color:'#888'}}>
                                    2nd extension slot {'\u2014'} large station
                                    {' \u2014 '}${(extCost(st.extension2, sk)/1000).toFixed(0)}k
                                  </div>
                                </div>
                                <span style={{background:ext2Color,color:'white',borderRadius:4,
                                  padding:'2px 7px',fontSize:11,fontWeight:600}}>
                                  {sk==='pd'?'SPEC':'EXT'}
                                </span>
                                {ext2Chk && <span>&#10003;</span>}
                              </label>
                            )}

                            {/* PD command zone */}
                            {sk==='pd' && st.command!==undefined && st.command>0 && (
                              <div style={{marginBottom:8,padding:'5px 10px',background:'#f0f4ff',
                                borderRadius:6,border:'1px solid #c5d0e8',fontSize:11,color:'#444'}}>
                                <span style={{fontWeight:700,color:tc.badge}}>Command Zone {st.command}</span>
                                {st.areaType && <span style={{color:'#888',marginLeft:6}}>{st.areaType}</span>}
                              </div>
                            )}

                            {/* Prison cells */}
                            {sk==='pd' && !NO_CELLS_STATION_IDS.has(st.id) && (
                              <PrisonCells grpKey={sk} stId={st.id} checked={checked} timestamps={timestamps} togglePrisonCell={togglePrisonCell}/>
                            )}

                            {/* Parking lot spaces */}
                            {!!PARKING_LOT_CONFIG[st.id] && (
                              <ParkingLot grpKey={sk} stId={st.id} checked={checked} timestamps={timestamps} toggleParking={toggleParking}/>
                            )}

                            {/* Boat parking upgrade (large marine stations) */}
                            {!!BOAT_PARKING_CONFIG[st.id] && (
                              <BoatParkingUpgrade grpKey={sk} stId={st.id} checked={checked} toggle={toggle}/>
                            )}

                            {st.extension && st.units.length>0 && (
                              <div style={{fontSize:10,fontWeight:600,color:'#999',
                                textTransform:'uppercase',letterSpacing:0.5,marginBottom:7}}>Units</div>
                            )}

                            {/* Units */}
                            <div style={{display:'flex',flexDirection:'column',gap:6}}>
                              {st.units.map(function(u,ui) {
                                var uid2     = unitId(sk,st.id,u.id);
                                var uChk     = !!checked[uid2];
                                var stor     = COL_UNIT_ID_SET.has(u.id) ? [] : (STORAGE_ITEMS[u.id]||[]);
                                var sDone    = stor.filter(function(s){return !!checked[storageItemKey(sk,st.id,u.id,s)];}).length;
                                var uKey     = 'u-'+sk+'-'+st.id+'-'+u.id;
                                var uOpen    = !!exp[uKey];
                                var uFull    = uChk && (stor.length===0 || sDone===stor.length);
                                var cost     = unitCost(ui, u.type);
                                var extBlocked = isUnitExtBlocked(u.id, st.extension, !!checked[extId(sk,st.id)], u.type, st.extension2, !!checked[ext2Id(sk,st.id)]);
                                var boatParkingBlocked = isUnitBoatParkingBlocked(u.id, sk, st.id, checked);
                                var extBlockReason = (function(){
                                  var req = UNIT_EXT_REQUIRED[u.id] || UNIT_TYPE_EXT_REQUIRED[u.type];
                                  return req || st.extension;
                                })();
                                var globalBlocked = isUnitGlobalBlocked(u.type, checked, u.id);
                                var anyBlocked = extBlocked || boatParkingBlocked || globalBlocked;
                                return (
                                  <div key={u.id} style={{border:'1px solid '+(uFull?'#2ecc71':anyBlocked?'#f5c6cb':'#ddd'),
                                    borderRadius:6,overflow:'hidden',
                                    background:uFull?'#e8f8e8':anyBlocked?'#fff5f5':'#fafafa',
                                    opacity:anyBlocked?0.6:1}}>
                                    <div style={{display:'flex',alignItems:'center',gap:7,padding:'6px 9px'}}>
                                      <input type="checkbox" checked={uChk}
                                        disabled={anyBlocked}
                                        onChange={function(){if(!anyBlocked) toggle(uid2);}}
                                        style={{width:14,height:14,accentColor:'#27ae60',cursor:anyBlocked?'not-allowed':'pointer'}}/>
                                      <div style={{flex:1,cursor:stor.length&&!anyBlocked?'pointer':'default',minWidth:0}}
                                        onClick={function(){if(stor.length&&!anyBlocked) toggleExp(uKey);}}>
                                        <div style={{fontSize:13,fontWeight:600,
                                          color:uChk?'#27ae60':anyBlocked?'#c0392b':'#1a2744',
                                          textDecoration:uFull?'line-through':'none'}}>{u.id}</div>
                                        <div style={{fontSize:11,color:'#888'}}>{u.type}
                                          {cost>0 && ' \u2014 $'+(cost/1000).toFixed(0)+'k'}
                                          {(unitStaff(u.id, u.type)||0)>0 && (
                                            <span style={{marginLeft:5,color:'#aaa'}}>
                                              · {unitStaff(u.id, u.type)} staff
                                            </span>
                                          )}
                                          {extBlocked && (
                                            <span style={{marginLeft:6,color:'#c0392b',fontWeight:600}}>
                                              🔒 Requires {extBlockReason} extension
                                            </span>
                                          )}
                                          {boatParkingBlocked && (
                                            <span style={{marginLeft:6,color:'#c0392b',fontWeight:600}}>
                                              🔒 Requires Boat Parking upgrade
                                            </span>
                                          )}
                                          {globalBlocked && (
                                            <span style={{marginLeft:6,color:'#c0392b',fontWeight:600}}>
                                              🔒 Requires {unitGlobalBlockedLabel(u.type, u.id)}
                                            </span>
                                          )}
                                        </div>
                                        {u.route && (
                                          <div style={{fontSize:10,color:'#777',fontStyle:'italic',
                                            marginTop:1,lineHeight:1.3}}>{u.route}</div>
                                        )}
                                      </div>
                                      {stor.length>0 && (
                                        <div style={{display:'flex',alignItems:'center',gap:4,cursor:'pointer'}}
                                          onClick={function(){toggleExp(uKey);}}>
                                          <span style={{fontSize:11,fontWeight:600,
                                            color:sDone===stor.length?'#27ae60':sDone>0?'#e67e22':'#bbb'}}>
                                            📦 {sDone}/{stor.length}
                                          </span>
                                          <span style={{fontSize:12,color:'#bbb',userSelect:'none'}}>
                                            {uOpen?'\u25b2':'\u25bc'}
                                          </span>
                                        </div>
                                      )}
                                      {uFull && <span style={{fontSize:12}}>&#10003;</span>}
                                    </div>
                                    {stor.length>0 && uOpen && (
                                      <div style={{borderTop:'1px solid #eee',
                                        padding:'5px 9px 7px 34px',
                                        background:'#f2f2f2',
                                        display:'flex',flexDirection:'column',gap:4}}>
                                        <div style={{fontSize:9,fontWeight:600,color:'#999',
                                          textTransform:'uppercase',letterSpacing:0.5,marginBottom:1}}>
                                          Storage Contents
                                        </div>
                                        {stor.map(function(s) {
                                          var sid2 = storageItemKey(sk,st.id,u.id,s);
                                          var sChk = !!checked[sid2];
                                          var sSpace = itemSpaces(s);
                                          var sBlocked = !sChk && (!storState.built || (storState.used + sSpace > storState.capacity));
                                          var sBlockReason = !storState.built ? 'Requires storage room' : 'No space \u2014 expand storage room';
                                          return (
                                            <label key={s} style={{display:'flex',alignItems:'center',
                                              gap:7,cursor:sBlocked?'not-allowed':'pointer'}}>
                                              <input type="checkbox" checked={sChk}
                                                disabled={sBlocked}
                                                onChange={function(){if(!sBlocked) toggle(sid2);}}
                                                style={{width:12,height:12,accentColor:'#27ae60',cursor:sBlocked?'not-allowed':'pointer'}}/>
                                              <span style={{fontSize:12,
                                                color:sChk?'#27ae60':sBlocked?'#c0392b':'#444',
                                                textDecoration:sChk?'line-through':'none'}}>{s}</span>
                                              {sChk && <span style={{fontSize:10,color:'#27ae60'}}>&#10003;</span>}
                                              {sBlocked && <span style={{fontSize:10,color:'#c0392b',fontWeight:600}}>🔒 {sBlockReason}</span>}
                                            </label>
                                          );
                                        })}
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>

                            {/* Storage room */}
                            {hasAnyStorage(st, sk) && (
                              <StorageRoomBlock grpKey={sk} st={st} checked={checked} toggle={toggle}/>
                            )}

                            {/* Mark all button */}
                            <div style={{marginTop:9,textAlign:'right'}}>
                              <button onClick={function(){toggleAll(sk,st);}}
                                style={{fontSize:11,padding:'3px 9px',borderRadius:5,
                                  border:'1px solid #ccc',cursor:'pointer',
                                  background:'white',color:'#555'}}>
                                {allIds(sk,st).every(function(id){return checked[id];})?'Unmark all':'Mark all complete'}
                              </button>
                            </div>

                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

    {/* ── PERSISTENT LIVE BACKUP BAR ── */}
    <LiveBackupBar calls={calls} checked={checked} timestamps={timestamps}
      trained={trained} sessions={sessions}
      setCalls={setCalls} setChecked={setChecked}
      setTimestamps={setTimestamps} setTrained={setTrained}
      setSessions={setSessions}/>

    </div>
  );
}


    const domRoot = ReactDOM.createRoot(document.getElementById('root'));
    domRoot.render(React.createElement(App));
  </script>
  <script>

    var V = 'v781';
    function addBadge(){
      if (!document.body || document.getElementById('gcdes-ver-badge')) return;
      var d = document.createElement('div');
      d.id = 'gcdes-ver-badge';
      d.textContent = V;
      d.style.cssText = 'position:fixed;bottom:4px;right:6px;z-index:99999;'
        + 'font:700 10px monospace;color:#fff;background:#1a2744;'
        + 'padding:2px 7px;border-radius:4px;opacity:0.8;pointer-events:none;'
        + 'letter-spacing:0.5px;';
      document.body.appendChild(d);
    }
    if (document.body) addBadge();
    document.addEventListener('DOMContentLoaded', addBadge);
    setTimeout(addBadge, 1500);
  })();
  </script>
