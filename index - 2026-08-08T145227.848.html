  <script>const _LS_PREFIX = 'gcdes::';
(function(){
  // Primary store: IndexedDB (quota in the hundreds of MB+ vs ~5MB for localStorage).
  // Legacy data saved under localStorage 'gcdes::<key>' is migrated forward on first read.
  var _DB='gcdes-store', _ST='kv', _dbp=null;
  var _idbOK = false;
  try { _idbOK = (typeof indexedDB !== 'undefined' && !!indexedDB); } catch(e){ _idbOK=false; }
  function _open(){
    if(_dbp) return _dbp;
    _dbp = new Promise(function(res,rej){
      try {
        var rq = indexedDB.open(_DB, 1);
        rq.onupgradeneeded = function(e){ try{ e.target.result.createObjectStore(_ST); }catch(_){} };
        rq.onsuccess = function(e){ res(e.target.result); };
        rq.onerror = function(){ rej(rq.error); };
        rq.onblocked = function(){ rej(new Error('idb blocked')); };
      } catch(err){ rej(err); }
    });
    return _dbp;
  }
  function _idbGet(key){ return _open().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(_ST,'readonly'); var rq=tx.objectStore(_ST).get(key);
    rq.onsuccess=function(){ res(rq.result); }; rq.onerror=function(){ rej(rq.error); };
  }); }); }
  function _idbSet(key,value){ return _open().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(_ST,'readwrite'); tx.objectStore(_ST).put(value,key);
    tx.oncomplete=function(){ res(true); }; tx.onerror=function(){ rej(tx.error); };
    tx.onabort=function(){ rej(tx.error||new Error('idb aborted')); };
  }); }); }
  function _idbDel(key){ return _open().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(_ST,'readwrite'); tx.objectStore(_ST).delete(key);
    tx.oncomplete=function(){ res(true); }; tx.onerror=function(){ rej(tx.error); };
  }); }); }
  function _idbKeys(){ return _open().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction(_ST,'readonly'); var rq=tx.objectStore(_ST).getAllKeys();
    rq.onsuccess=function(){ res(rq.result||[]); }; rq.onerror=function(){ rej(rq.error); };
  }); }); }

  window.storage = {
    get: async function(key) {
      if(_idbOK){
        try {
          var v = await _idbGet(key);
          if(v !== undefined && v !== null) return { key: key, value: v };
        } catch(e){}
      }
      // Legacy localStorage fallback + one-time forward migration
      var lv = null;
      try { lv = localStorage.getItem(_LS_PREFIX + key); } catch(e){}
      if(lv === null || lv === undefined) throw new Error('Key not found: ' + key);
      if(_idbOK){ try { await _idbSet(key, lv); } catch(e){} }
      return { key: key, value: lv };
    },
    set: async function(key, value) {
      if(_idbOK){
        try { await _idbSet(key, value); return { key: key, value: value }; }
        catch(e){ /* fall back to localStorage below */ }
      }
      try { localStorage.setItem(_LS_PREFIX + key, value); return { key: key, value: value }; }
      catch(e) { return null; }
    },
    delete: async function(key) {
      if(_idbOK){ try { await _idbDel(key); } catch(e){} }
      try { localStorage.removeItem(_LS_PREFIX + key); } catch(e){}
      return { key: key, deleted: true };
    },
    list: async function(prefix) {
      var keys = [];
      if(_idbOK){
        try {
          var ks = await _idbKeys();
          for(var j=0;j<ks.length;j++){ var kk=String(ks[j]); if(!prefix || kk.startsWith(prefix)) keys.push(kk); }
        } catch(e){}
      }
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.startsWith(_LS_PREFIX)) {
            var stripped = k.slice(_LS_PREFIX.length);
            if ((!prefix || stripped.startsWith(prefix)) && keys.indexOf(stripped) < 0) keys.push(stripped);
          }
        }
      } catch(e){}
      return { keys: keys };
    }
  };
})();</script>

};

// Normalize a street string: lowercase, trim, apply aliases
function normalizeStreet(raw) {
  if (!raw) return "";
  let s = raw.toLowerCase().trim();
  // Drop periods so "Church St." matches "Church St" and "W. Main" matches "W Main".
  s = s.replace(/\./g, '').trim();
  // Apply prefix aliases (order matters — longest first)
  const prefixAliases = [
    ["state highway ", "ny-"],  // "state highway 23a" → "ny-23a"
    ["state route ",   "ny-"],
    ["state rd ",      "ny-"],
    ["us route ",      "us-"],
    ["interstate ",    "i-"],
    ["county rd ",     "county route "],
    ["co rt ",         "county route "],
    ["rte ",           "ny-"],
    ["route ",         "ny-"],
    ["sr ",            "ny-"],
    ["rt ",            "ny-"],
    ["us ",            "us-"],
  ];
  for (const [from, to] of prefixAliases) {
    if (s.startsWith(from)) { s = to + s.slice(from.length); break; }
  }
  // Canonicalize county-route designations so all spellings match:
  // "cr23c" / "cr 23c" / "cr-23c" / "county route 23c" / "county road 23c" → "cr-23c"
  s = s.replace(/^(?:cr|county route|county road|county rd|co rd)[\s-]*([0-9]+[a-z]?)$/, 'cr-$1');
  // Apply specific word aliases
  s = s.replace(/\banbach\b/g, "ambach");
  s = s.replace(/\bcoll?aruss?o\b/g, "colarusso"); // unify Colarusso / Collarusso / Collaruso
  // Canonicalize US Route 9W: 9w / us 9w / us-9w / ny-9w / ny 9w → "us-9w" (no double prefix)
  s = s.replace(/^(?:us|ny)?[\s-]*9w$/, "us-9w");
  // Apply suffix type abbreviations
  const suffixAliases = [
    [/ rd$/, " road"], [/ st$/, " street"], [/ ave$/, " avenue"],
    [/ blvd$/, " boulevard"], [/ ln$/, " lane"], [/ dr$/, " drive"],
    [/ ct$/, " court"], [/ pl$/, " place"], [/ hwy$/, " highway"],
    [/ pkwy$/, " parkway"], [/ tpke$/, " turnpike"], [/ tpk$/, " turnpike"],
  ];
  for (const [re, rep] of suffixAliases) { s = s.replace(re, rep); }
  // Also expand abbreviations mid-word (e.g. "Allendale Rd West" → "Allendale Road West")
  s = s.replace(/\brd\b/g, 'road');
  s = s.replace(/\bst\b/g, 'street');
  s = s.replace(/\bave\b/g, 'avenue');
  s = s.replace(/\bblvd\b/g, 'boulevard');
  s = s.replace(/\bln\b/g, 'lane');
  s = s.replace(/\bdr\b/g, 'drive');
  s = s.replace(/\bct\b/g, 'court');
  s = s.replace(/\bpl\b/g, 'place');
  return s.trim();
}

  return raw.toLowerCase().trim().replace(/\s+/g, " ");

// SECTION 4: ZIP → CENTER BOX LOOKUP
// Auto-derived from box definitions (isZipCenter: true)
// ------------------------------------------------------------
const ZIP_CENTER_BOX = {};
for (const box of GCDES_BOXES) {
  if (box.isZipCenter && !ZIP_CENTER_BOX[box.zip]) {
    ZIP_CENTER_BOX[box.zip] = box.id;
  }
}

// ------------------------------------------------------------
// SECTION 5: ADDRESS → BOX MATCHING FUNCTION
// Returns: { boxIds: string[], method: string, unresolved: boolean }
//   boxIds:     array of matched box IDs (usually 1, sometimes 2+)
//   method:     "full_address" | "street_zip" | "zip_center" | "unknown"
//   unresolved: true if fell back to center box due to no street match
//   unmatchedStreet: the street name that failed to match (if any)
// ------------------------------------------------------------
// Box street-entry matchers. Entries may be legacy strings OR Columbia-style
// objects {name, aliases, range, oddOnly, evenOnly}. Mixed lists are supported.
function _strWholeWordMatch(entry, normSt) {
  // exact, or one string is a whole-word (space-bounded) substring of the other.
  // 3-char floor stops mid-type fragments ("s", "sc") from matching street names.
  if (entry === normSt) return true;
  if (!normSt || normSt.length < 3) return false;
  var ee = ' ' + entry + ' ', nn = ' ' + normSt + ' ';
  return ee.indexOf(nn) >= 0 || nn.indexOf(ee) >= 0;
}
function _boxEntryNameHit(entry, normSt) {
  if (!normSt) return false;
  if (typeof entry === "string") {
    return _strWholeWordMatch(entry, normSt);
  }
  if (normalizeStreet(entry.name) === normSt) return true;
  if (entry.aliases) {
    for (const a of entry.aliases) { if (normalizeStreet(a) === normSt) return true; }
  }
  return false;
}
function _boxEntryMatch(entry, normSt, houseNum) {
  // returns {hit, span}; span = range width (0 = discrete) or Infinity (name-only)
  if (typeof entry === "string") {
    const h = _strWholeWordMatch(entry, normSt);
    return h ? { hit: true, span: Infinity } : { hit: false };
  }
  if (!_boxEntryNameHit(entry, normSt)) return { hit: false };
  const constrained = !!(entry.range || entry.oddOnly || entry.evenOnly);
  if (houseNum === null) {
    return constrained ? { hit: false } : { hit: true, span: Infinity };
  }
  const parityOk = (!entry.oddOnly && !entry.evenOnly)
    || (entry.oddOnly && houseNum % 2 !== 0)
    || (entry.evenOnly && houseNum % 2 === 0);
  if (!parityOk) return { hit: false };
  if (entry.range) {
    if (houseNum < entry.range[0] || houseNum > entry.range[1]) return { hit: false };
    return { hit: true, span: entry.range[1] - entry.range[0] };
  }
  return { hit: true, span: Infinity };
}

function matchAddressToBoxes(rawStreet, rawZip, rawPlace, houseNum) {
  // Step 1: resolve ZIP from place name if ZIP not provided
  let zip = (rawZip || "").trim();
  if (!zip && rawPlace) {
    zip = HAMLET_TO_ZIP[normalizePlace(rawPlace)] || "";
  }

  // Step 2: if still no ZIP, return unknown
  if (!zip) {
    return {
      boxIds: [],
      method: "unknown",
      unresolved: true,
      unmatchedStreet: rawStreet || null,
    };
  }

  // Step 3: if no street, return ZIP center box
  if (!rawStreet || rawStreet.trim() === "") {
    const centerId = ZIP_CENTER_BOX[zip];
    return {
      boxIds: centerId ? [centerId] : [],
      method: "zip_center",
      unresolved: false,
      unmatchedStreet: null,
    };
  }

  // Step 4: filter boxes by ZIP
  const zipBoxes = GCDES_BOXES.filter(b => b.zip === zip || (b.altZips && b.altZips.indexOf(zip) >= 0) || (b.streets && b.streets.some(e => e.altZips && e.altZips.indexOf(zip) >= 0)));

  // Step 4b: intersection address ("A & B" / "A and B" / "A / B")
  // → box(es) whose street list contains BOTH cross-streets (house number ignored).
  const _ixn = String(rawStreet).split(/\s*(?:&|\sand\s|\/)\s*/i).map(x => x.trim()).filter(Boolean);
  if (_ixn.length === 2) {
    const xs1 = normalizeStreet(_ixn[0]);
    const xs2 = normalizeStreet(_ixn[1]);
    const ixMatches = zipBoxes.filter(b =>
      b.streets.some(e => _boxEntryNameHit(e, xs1)) && b.streets.some(e => _boxEntryNameHit(e, xs2))
    );
    if (ixMatches.length > 0) {
      return { boxIds: ixMatches.map(b => b.id), method: "intersection", unresolved: false, unmatchedStreet: null };
    }
  }

  // Step 5: normalize street + parse house number; match entries (string or object).
  const normalizedStreet = normalizeStreet(rawStreet);
  const hn = (houseNum === undefined || houseNum === null || isNaN(houseNum)) ? null : houseNum;

  let best = null;        // finite span wins → narrowest range (enables discrete carve-outs)
  const nameOnly = [];    // legacy/full-street name hits (span = Infinity)
  for (const b of zipBoxes) {
    const _bZipOk = (b.zip === zip) || (b.altZips && b.altZips.indexOf(zip) >= 0);
    for (const e of b.streets) {
      const m = _boxEntryMatch(e, normalizedStreet, hn);
      if (!m.hit) continue;
      // Per-entry ZIP gate: if the box only qualified via a street-level altZip, then
      // only that specific street resolves under the foreign ZIP — not the box's others.
      if (!_bZipOk && !(e.zip === zip || (e.altZips && e.altZips.indexOf(zip) >= 0) || e.noZipOk)) continue;
      if (m.span === Infinity) nameOnly.push(b.id);
      if (best === null || m.span < best.span) best = { id: b.id, span: m.span };
    }
  }

  if (best && best.span !== Infinity) {
    // specific range/parity match — narrowest wins (e.g. Goshen #686 → 0002 over 0008's 677-1463)
    return { boxIds: [best.id], method: "street_zip", unresolved: false, unmatchedStreet: null };
  }
  if (nameOnly.length > 0) {
    const uniq = nameOnly.filter((v, i, a) => a.indexOf(v) === i);
    return { boxIds: uniq, method: uniq.length === 1 ? "street_zip" : "street_zip_multi", unresolved: false, unmatchedStreet: null };
  }

  // Step 5b: no house number, and the street only has ranged/parity entries (so nothing
  // matched above). Resolve by street NAME alone: one box carrying it -> that box; several
  // -> return all (box picker). Mirrors the discrete-number path, just without a number.
  if (hn === null) {
    const nameBoxes = [];
    for (const b of zipBoxes) {
      const _bZipOk = (b.zip === zip) || (b.altZips && b.altZips.indexOf(zip) >= 0);
      if (b.streets.some(e => _boxEntryNameHit(e, normalizedStreet) &&
            (_bZipOk || e.zip === zip || (e.altZips && e.altZips.indexOf(zip) >= 0) || e.noZipOk))) nameBoxes.push(b.id);
    }
    const uniqNB = nameBoxes.filter((v, i, a) => a.indexOf(v) === i);
    if (uniqNB.length > 0) {
      return { boxIds: uniqNB, method: uniqNB.length === 1 ? "street_zip" : "street_zip_multi", unresolved: false, unmatchedStreet: null };
    }
  }

  // Step 6: no street match — fall back to ZIP center box, log unresolved
  const centerId = ZIP_CENTER_BOX[zip];
  return {
    boxIds: centerId ? [centerId] : [],
    method: "zip_center",
    unresolved: true,
    unmatchedStreet: normalizedStreet,
  };
}

// ------------------------------------------------------------
// SECTION 6: UNRESOLVED STREET LOG
// Accumulates streets that couldn't be matched to a box
// Persists via localStorage so it survives page reloads
// ------------------------------------------------------------
const UNRESOLVED_LOG_KEY = "gcdes-unresolved-streets-v1";

function logUnresolvedStreet(street, zip) {
  if (!street) return;
  try {
    const raw = localStorage.getItem(UNRESOLVED_LOG_KEY);
    const log = raw ? JSON.parse(raw) : {};
    const key = `${street}||${zip}`;
    log[key] = (log[key] || 0) + 1;
    localStorage.setItem(UNRESOLVED_LOG_KEY, JSON.stringify(log));
  } catch(e) { /* storage unavailable */ }
}

function getUnresolvedStreets() {
  try {
    const raw = localStorage.getItem(UNRESOLVED_LOG_KEY);
    if (!raw) return [];
    const log = JSON.parse(raw);
    return Object.entries(log)
      .map(([key, count]) => {
        const [street, zip] = key.split("||");
        return { street, zip, count };
      })
      .sort((a, b) => b.count - a.count);
  } catch(e) { return []; }
}

function clearUnresolvedStreets() {
  try { localStorage.removeItem(UNRESOLVED_LOG_KEY); } catch(e) {}
}

// ── PD: Drone auto-assignment ─────────────────────────────────────────────────
// Drones go to: PD MCVs, ESU Armoured Vehicles, River Sgt, Riot Sgt only
{
  const DRONE_UNIT_TYPES = new Set(["Mobile Command","Armoured Vehicle","River Sergeant","Riot Sergeant"]);
  const allPDStations = [...PD_PRECINCTS, ...PD_OUTPOSTS];
  for(const st of allPDStations){
    for(const u of st.units){
      if(DRONE_UNIT_TYPES.has(u.type)){
        // Store under a 'pd::'-prefixed key: PD "Mobile Cmd 1/2/3" share bare unit
        // ids with FIRE "Mobile Cmd 1/2/3" (Stations 3/6/10), so a bare-id write
        // here would surface the drone (and its Drone Operator course requirement)
        // on the fire units too. There are no fire drones, so "Mobile Command" —
        // the one type that collides with fire naming — always writes to the
        // dept-scoped key; only PD-unique types (Armoured Vehicle, River/Riot
        // Sergeant) use the bare id.
        var _pdKey = (u.type === "Mobile Command") ? ('pd::'+u.id) : u.id;
        if(!STORAGE_ITEMS[_pdKey]) STORAGE_ITEMS[_pdKey]=[];
        if(!STORAGE_ITEMS[_pdKey].includes("Drone")) STORAGE_ITEMS[_pdKey].push("Drone");
      }
    }
  }
};

// Dept-scoped storage defaults. Most units are keyed by bare unit id, but units
// whose id is not unique across departments (PD vs fire "Mobile Cmd 1/2/3") store
// their dept-specific items under a 'deptKey::unitId' key. Falls back to the bare
// id so every other unit is unaffected.
function storageDefaults(deptKey, unitId) {
  if (deptKey && STORAGE_ITEMS[deptKey + '::' + unitId]) return STORAGE_ITEMS[deptKey + '::' + unitId];
  return STORAGE_ITEMS[unitId] || [];
}

// Regex to detect highway-style street names that need disambiguation
function isHighwayDesignation(street) {
  if (!street) return false;
  var s = street.trim();
  return !!(
    s.match(/^us[- ]?\d+/i) ||
    s.match(/^u\.s\.?[- ]?\d+/i) ||
    s.match(/^ny[- ]?\d+/i) ||
    s.match(/^new york[- ]?\d+/i) ||
    s.match(/^state (route|highway|rd|road)[- ]?\d+/i) ||
    s.match(/^(county|co)\.?[- ]?(road|route|rd|rt)[- ]?\d+/i) ||
    s.match(/^cr[- ]?\d+/i) ||
    s.match(/^i[- ]?\d+/i) ||
    s.match(/^interstate[- ]?\d+/i)
  );
}

// Normalize a highway name to look up in HIGHWAY_SURFACE_STREETS
function normalizeHighway(street) {
  if (!street) return '';
  var s = street.trim().toLowerCase();
  // US routes
  s = s.replace(/^u\.s\.?\s*route\s*/, 'us ');
  s = s.replace(/^u\.s\.?\s*highway\s*/, 'us ');
  s = s.replace(/^u\.s\.?\s*/, 'us ');
  s = s.replace(/^us-/, 'us ');
  s = s.replace(/^united states (route|highway)\s*/, 'us ');
  // NY routes
  s = s.replace(/^new york (state )?(route|highway)\s*/, 'ny ');
  s = s.replace(/^nys?\s*(route|highway|rte|hwy)?\s*/, 'ny ');
  s = s.replace(/^ny-/, 'ny ');
  s = s.replace(/^state (route|highway)\s*/, 'ny ');
  // County roads
  s = s.replace(/^county (road|route)\s*/, 'cr ');
  s = s.replace(/^co\.?\s*(road|route|rd|rt)\.?\s*/, 'cr ');
  // Collapse a leftover route hyphen ("ny -9j" / "ny-9j" -> "ny 9j") so hyphenated
  // forms key the same as "State Highway 9J".
  s = s.replace(/^(us|ny|cr)\s*-\s*/, '$1 ').replace(/\s+/g, ' ');
  return s.trim();
}

// ── Derived: surface-street segment chooser ───────────────────────────────────
// Any surface street that is an alias of a disambiguated highway should ALSO hit
// the no-house-number chooser, so a dispatcher can pick the district by eye.
// Built automatically by grouping every HIGHWAY_SURFACE_STREETS option by its
// surface street name + ZIP, then merged with the manual overrides above.
// A street is offered for disambiguation only when it has 2+ distinct segments in
// a ZIP (a single-segment street resolves to one district with no ambiguity).
// SEGMENT_DIST_INDEX is the unfiltered lookup the resolver uses to map a chosen
// "street||label" back to its exact district id.
const SURFACE_STREET_SEGMENTS = {};
const SEGMENT_DIST_INDEX = {};
(function buildSurfaceSegments(){
  var grouped = {};
  function ingest(zip, opt){
    if (!opt || !opt.street || !zip) return;
    var sKey = normalizeStreet(opt.street)+'||'+zip;
    if (!grouped[sKey]) grouped[sKey] = [];
    // dedupe by label across highway entries that repeat the same segment
    for (var i=0;i<grouped[sKey].length;i++){ if (grouped[sKey][i].label === opt.label) return; }
    grouped[sKey].push(opt);
    // record explicit dist for exact-label resolution
    if (opt.dist) SEGMENT_DIST_INDEX[sKey+'||'+opt.label.toLowerCase()] = opt.dist;
  }
  var hwKeys = Object.keys(HIGHWAY_SURFACE_STREETS);
  for (var k=0;k<hwKeys.length;k++){
    var zip = hwKeys[k].split('||')[1];
    var opts = HIGHWAY_SURFACE_STREETS[hwKeys[k]];
    for (var o=0;o<opts.length;o++) ingest(zip, opts[o]);
  }
  var mdKeys = Object.keys(MULTI_DISTRICT_SURFACE_STREETS);
  for (var m=0;m<mdKeys.length;m++){
    var zip2 = mdKeys[m].split('||')[1];
    var opts2 = MULTI_DISTRICT_SURFACE_STREETS[mdKeys[m]];
    for (var o2=0;o2<opts2.length;o2++) ingest(zip2, opts2[o2]);
  }
  // Keep only streets that genuinely span 2+ segments
  var allKeys = Object.keys(grouped);
  for (var a=0;a<allKeys.length;a++){ if (grouped[allKeys[a]].length >= 2) SURFACE_STREET_SEGMENTS[allKeys[a]] = grouped[allKeys[a]]; }
})();

// Resolve a chosen "street||label" segment to its exact district id (or null).
function lookupSegmentDistrict(streetPart, labelHint, zip){
  if (!streetPart || !labelHint || !zip) return null;
  var key = normalizeStreet(streetPart)+'||'+zip+'||'+labelHint.trim().toLowerCase();
  return SEGMENT_DIST_INDEX[key] || null;
}

function dispatchTypeToRcColumns(dispatchType) {
  if (!dispatchType) return [];
  var t = dispatchType.toLowerCase().trim();
  var cols = [];

  // ── Roster type names (from unit definitions) ─────────────────────────────
  // Fire — engine/squad
  if (t==='pumper'||t==='reserve pumper') cols.push('engine');
  if (t==='heavy rescue squad') { cols.push('engine'); cols.push('rescue'); }
  // Fire — truck
  if (t==='aerial ladder'||t==='tower ladder') cols.push('truck');
  // Fire — rescue
  if (t==='technical rescue') cols.push('rescue');
  // Fire — tanker
  if (t==='tanker') cols.push('tanker');
  // Fire — chief
  if (t==='battalion chief'||t==='division chief') cols.push('chief');
  // Fire — air/mask
  if (t==='mask service unit') cols.push('air');
  // Fire — BFU
  if (t==='brush fire unit') cols.push('bfu');
  // Fire — FIU
  if (t==='fire investigation unit') cols.push('fiu');
  // Fire — foam
  if (t==='foam unit') cols.push('foam');
  // Fire — hazmat
  if (t==='hazmat unit') cols.push('hazmat');
  // Fire — MCV
  if (t==='mobile command') cols.push('mcv');
  // Fire — swift water
  if (t==='light boat'||t==='light boat trailer'||t==='water rescue unit') cols.push('swiftwater');
  // Utility units are support vehicles — swift water only carried by the boat itself
  // EMS
  if (t==='als ambulance') cols.push('als');
  if (t==='bls ambulance') cols.push('bls');
  if (t==='als rescue medic'||t==='rescue medic (als)') { cols.push('als'); cols.push('rescue'); }
  if (t==='bls hazmat ambulance'||t==='bls hazmat') { cols.push('emsHazmat'); cols.push('bls'); }
  if (t==='als hazmat ambulance'||t==='als hazmat') { cols.push('emsHazmat'); cols.push('als'); }
  // H units (BLS HazMat) and Z units (ALS HazMat) detected by unit ID suffix
  // This is handled by type string above; also catch by examining the dispatchType directly
  if (t==='bls hazmat ambulance') { if(!cols.includes('bls')) cols.push('bls'); }
  if (t==='als hazmat ambulance') { if(!cols.includes('als')) cols.push('als'); }
  if (t==='ems supervisor') cols.push('emsChief');
  if (t==='als flycar') cols.push('flycar');
  if (t==='medical helicopter (als)'||t==='medical helicopter'||t==='air ambulance') cols.push('helo');
  // PD
  if (t==='patrol car') cols.push('patrol');
  if (t==='esu vehicle') cols.push('esu');
  if (t==='k9 unit') cols.push('k9');
  if (t==='precinct sergeant'||t==='river sergeant'||t==='riot sergeant') cols.push('sgt');
  if (t==='game warden') cols.push('warden');

  // ── Dispatch string formats (from sim display names) ──────────────────────
  if (t==='type 1 fire engine'||t==='spare type 1 fire engine') { if (!cols.includes('engine')) cols.push('engine'); }
  if (t==='rescue engine') { if (!cols.includes('engine')) cols.push('engine'); if (!cols.includes('rescue')) cols.push('rescue'); }
  if (t==='platform truck') { if (!cols.includes('truck')) cols.push('truck'); }
  if (t==='heavy rescue vehicle') { if (!cols.includes('rescue')) cols.push('rescue'); }
  if (t==='water tanker') { if (!cols.includes('tanker')) cols.push('tanker'); }
  if (t==='mobile air') { if (!cols.includes('air')) cols.push('air'); }
  if (t.includes('brush fire unit')||t.includes('type 5 fire engine')||t.includes('type 6 fire engine')) { if (!cols.includes('bfu')) cols.push('bfu'); }
  if (t==='fire investigator unit'||t==='fire prevention unit') { if (!cols.includes('fiu')) cols.push('fiu'); }
  if (t==='foam tender') { if (!cols.includes('foam')) cols.push('foam'); }
  if (t==='hazmat') { if (!cols.includes('hazmat')) cols.push('hazmat'); }
  if (t==='mcv') { if (!cols.includes('mcv')) cols.push('mcv'); }
  if (t==='light boat trailer') { if (!cols.includes('swiftwater')) cols.push('swiftwater'); }
  if (t==='als'||t==='als ambulance') { if (!cols.includes('als')) cols.push('als'); }
  if (t==='bls'||t==='bls ambulance') { if (!cols.includes('bls')) cols.push('bls'); }
  if (t==='fly-car'||t==='flycar') { if (!cols.includes('flycar')) cols.push('flycar'); }
  if (t==='ems rescue') { if (!cols.includes('als')) cols.push('als'); if (!cols.includes('rescue')) cols.push('rescue'); }
  if (t==='battalion chief unit') { if (!cols.includes('chief')) cols.push('chief'); }

  // Utility units always go to support only (boat itself carries swiftwater)
  if (t==='utility'||t==='utility unit') { if(cols.length===0) cols.push('support'); return cols; }
  // Support catch-all
  if (cols.length===0) cols.push('support');
  return cols;
}

// ── Columbia address → district resolver ──────────────────────────────────────
// Returns district id string, or null if unresolved (falls back to generic H01
// for that municipality if ZIP matches, otherwise null).
// Note: streets whose POSTAL zip differs from their fire-district zip opt into
// the extra zip via an `altZips:[...]` field on the street entry itself (so the
// district's range stays the single source of truth). See Eichybush Rd in T06.

// ── Town/ZIP consistency data (for the import mismatch disambiguator) ──────────
// Built from COL_DISTRICTS: which ZIPs each town legitimately uses, plus each
// town's primary (most common) ZIP, used to correct a mismatched ZIP.
var COLUMBIA_TOWN_ZIPS = {};        // municipality -> Set(zips)
var COLUMBIA_TOWN_PRIMARY_ZIP = {}; // municipality -> primary zip
(function(){
  var freq = {};
  COL_DISTRICTS.forEach(function(d){
    if (d.generic || !d.municipality) return;
    var muni = d.municipality;
    if (!COLUMBIA_TOWN_ZIPS[muni]) { COLUMBIA_TOWN_ZIPS[muni] = new Set(); freq[muni] = {}; }
    [d.zip, d.zip2, d.zip3].forEach(function(z){
      if (z) { COLUMBIA_TOWN_ZIPS[muni].add(z); freq[muni][z] = (freq[muni][z]||0)+1; }
    });
  });
  Object.keys(freq).forEach(function(muni){
    var best=null, bc=-1;
    Object.keys(freq[muni]).forEach(function(z){ if (freq[muni][z] > bc) { bc=freq[muni][z]; best=z; } });
    COLUMBIA_TOWN_PRIMARY_ZIP[muni] = best;
  });
})();
var COLUMBIA_TOWN_NAMES = Object.keys(COLUMBIA_TOWN_ZIPS);
// Pull a known Columbia town out of a free-text location tail, e.g.
// "Town of Stuyvesant" / "City of Hudson" / bare "Stuyvesant" -> "Stuyvesant".
function extractColumbiaTown(tail){
  if (!tail) return null;
  var t = String(tail).replace(/\b(town|city|village)\s+of\s+/ig,' ').replace(/,/g,' ');
  var found = null;
  COLUMBIA_TOWN_NAMES.slice().sort(function(a,b){return b.length-a.length;}).forEach(function(muni){
    if (found) return;
    if (new RegExp('\\b'+muni.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(t)) found = muni;
  });
  return found;
}
// Towns that legitimately own a given ZIP.
function columbiaTownsForZip(zip){
  return COLUMBIA_TOWN_NAMES.filter(function(m){ return COLUMBIA_TOWN_ZIPS[m].has(zip); });
}

// All generic districts that claim a given ZIP (zip / zip2 / zip3).
function columbiaGenericsForZip(zip){
  var z=(zip||'').trim(); var out=[];
  for (var i=0;i<COL_DISTRICTS.length;i++){ var d=COL_DISTRICTS[i];
    if (d.generic && (d.zip===z||d.zip2===z||d.zip3===z)) out.push(d); }
  return out;
}
// The "home" generic for a ZIP = the generic district whose municipality matches
// the ZIP's own town (per COLUMBIA_ZIPS). This is the principled default when a
// ZIP has multiple overlapping generics (e.g. 12534 -> Hudson, not first-in-array).
function columbiaHomeGeneric(zip){
  var gens=columbiaGenericsForZip(zip); if(!gens.length) return null;
  var place=((columbiaZipLookup[(zip||'').trim()]||{}).place||'').toLowerCase();
  for (var i=0;i<gens.length;i++){ if (place.indexOf(gens[i].municipality.toLowerCase())>=0) return gens[i]; }
  return gens[0];
}
// Find the generic district for a SPECIFIC named town within a ZIP. Used so that
// a dispatch that names a town overrides the ZIP's primary-town default — e.g.
// "Town of Clermont 12526" with no street resolves to Clermont's generic (CL01)
// instead of 12526's home generic (Germantown GT01).
function columbiaTownGeneric(town, zip){
  if(!town) return null;
  var t=String(town).toLowerCase(), z=(zip||'').trim();
  for (var i=0;i<COL_DISTRICTS.length;i++){
    var d=COL_DISTRICTS[i];
    if(!d.generic || !d.municipality) continue;
    if(d.municipality.toLowerCase()!==t) continue;
    if(d.zip===z || d.zip2===z || d.zip3===z) return d;
  }
  return null;
}
// True only when the id belongs to a generic district.
function isColumbiaGenericId(id){
  if(!id) return false;
  for (var i=0;i<COL_DISTRICTS.length;i++){ if(COL_DISTRICTS[i].id===id) return !!COL_DISTRICTS[i].generic; }
  return false;
}

function allIds(sk, st) {
  const ids = [stId(sk,st.id)];
  if (st.extension) ids.push(extId(sk,st.id));
  if (st.extension2) ids.push(ext2Id(sk,st.id));
  // Storage room + expansion if any unit has storage items
  const totalStorItems = storageSpacesNeeded(st.units, sk);
  if (totalStorItems > 0) {
    ids.push(storageRoomKey(sk,st.id));
    if (totalStorItems > 40) ids.push(storageRoomExpKey(sk,st.id));
    if (totalStorItems > 70) ids.push(storageRoomExp2Key(sk,st.id));
  }
  for (const u of st.units) {
    ids.push(unitId(sk,st.id,u.id));
    // Use storageItemKey (same key as training system) for storage item checkboxes
    if (!COL_UNIT_ID_SET.has(u.id)) { for (const s of storageDefaults(sk, u.id)) ids.push(storageItemKey(sk,st.id,u.id,s)); }
  }
  // Prison cells for PD precincts (command is defined for precincts, undefined for outposts).
  // TOW is a tow-truck outpost with no holding cells, so it's excluded even though
  // it defines `command` (used there only for map-zone grouping, not a precinct).
  if (sk === 'pd' && st.command !== undefined && !NO_CELLS_STATION_IDS.has(st.id)) {
    var _cellMax = prisonCellMax(st.id);
    for (var _ci = 1; _ci <= _cellMax; _ci++) ids.push(prisonId(sk, st.id, _ci));
  }
  // Parking lot spaces (e.g. Tow Truck Station impound lot)
  var _pcfg = PARKING_LOT_CONFIG[st.id];
  if (_pcfg) {
    for (var _pi = 1; _pi <= _pcfg.max; _pi++) ids.push(parkingSpaceId(sk, st.id, _pi));
  }
  // Boat parking upgrade (large marine stations)
  if (BOAT_PARKING_CONFIG[st.id]) ids.push(boatParkingId(sk, st.id));
  return ids;
}

function tabStats(tab, checked) {
  let total=0, done=0, totalSt=0, doneSt=0;
  const groups = getGroups(tab);
  for (const g of groups) for (const st of g.stations) {
    totalSt++;
    const ids = allIds(g.key, st);
    if (ids.every(id=>checked[id])) doneSt++;
    total += ids.length;
    done  += ids.filter(id=>checked[id]).length;
  }
  return {total:total,done:done,totalSt:totalSt,doneSt:doneSt};
}

const PRISON_CELL_MAX_OVERRIDE = { 'R': 10 };
function prisonCellMax(stId) { return PRISON_CELL_MAX_OVERRIDE[stId] || 2; }

// Each cell takes 7 days to build. Unlike the tow parking spots (which won't
// let you even start the next one until the current one finishes), cells CAN
// be queued in advance — checking cell 2 while cell 1 is still building is
// allowed — but cell 2's own 7-day clock doesn't start ticking until cell 1's
// finishes. So two cells queued together back-to-back take 14 days, not 7.
const PRISON_CELL_DURATION_MS = 7 * 24 * 60 * 60 * 1000;
function prisonCellTimerKey(key, stId, idx) { return `timer:prison:${key}:${stId}:${idx}`; }
// Computes the actual start time for cell `idx`: now, or later if the
// previous cell hasn't finished yet.
function prisonCellStartTime(key, stId, idx, timestamps) {
  if (idx <= 1) return Date.now();
  var prevStart = timestamps[prisonCellTimerKey(key, stId, idx - 1)];
  var prevComplete = prevStart ? prevStart + PRISON_CELL_DURATION_MS : 0;
  return Math.max(Date.now(), prevComplete);
}
function prisonCellTimerRemaining(key, stId, idx, timestamps) {
  var start = timestamps[prisonCellTimerKey(key, stId, idx)];
  if (!start) return PRISON_CELL_DURATION_MS;
  return Math.max(0, (start + PRISON_CELL_DURATION_MS) - Date.now());
}
function isPrisonCellTimerComplete(key, stId, idx, timestamps) {
  var start = timestamps[prisonCellTimerKey(key, stId, idx)];
  if (!start) return false;
  return Date.now() >= start + PRISON_CELL_DURATION_MS;
}

// Haversine distance in km between two lat/lng points
function haversineKm(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Geographic midpoint between two lat/lng points
function geoMidpoint(lat1, lng1, lat2, lng2) {
  return { lat: (lat1+lat2)/2, lng: (lng1+lng2)/2 };
}

    if (_info.type === 'Mask Service Unit' || _info.type === 'Mask Service') continue;
    // Must be built
    if (!checked[unitId(_info.key, _info.stId, _uid)]) continue;
    // Minimum 8 timed responses
    if (_ur.count < 8) continue;

    var _avg = _ur.count > 0 ? _ur.total / _ur.count : 0;
    var _std = rtStd(_uid);
    var _overBy = _avg - _std;

    // Trigger: avg RT exceeds NFPA standard by >=2 minutes (120 seconds)
    if (_overBy < 120) continue;

    var _can = CANON_MAP[_info.type] || _info.type;
    // Gap rate for this canonical type
    var _tg = typeGap[_can] || {needed:0, nonImm:0};
    var _gapPct = _tg.needed > 0 ? Math.round(_tg.nonImm/_tg.needed*100) : 0;

    var _next = nextUnbuiltSameType(_uid);
    var _overMin = Math.floor(_overBy/60);
    var _overSec = Math.round(_overBy%60);
    var _overStr = _overMin+':'+((_overSec<10)?'0':'')+_overSec;

    var _detail = _uid+' averaging '+fmtSecs(_avg)+
      ' — NFPA standard '+fmtSecs(_std)+
      ' (over by '+_overStr+')'+
      (_gapPct>0 ? ' · '+_gapPct+'% of '+_can+' responses county-wide delayed/mutual aid' : '')+
      (_next ? ' · Consider: '+_next : ' · No unbuilt backup in area — discuss in chat');

    var _severity = _overBy >= 300 ? 'critical' : _overBy >= 180 ? 'high' : 'moderate';

    signals.push({
      id: 'pressure-rt-'+_uid,
      uid: _uid,
      stName: _info.stName,
      dept: _info.dept,
      canType: _can,
      avgRt: _avg,
      standard: _std,
      overBy: _overBy,
      timedCount: _ur.count,
      gapPct: _gapPct,
      label: _info.dept+' · '+_info.stName+' · '+_uid,
      detail: _detail,
      nextUnbuilt: _next,
      severity: _severity,
    });
  }

  // Sort: critical first, then by overBy descending
  signals.sort(function(a,b) {
    var sev = {critical:0,high:1,moderate:2};
    if (sev[a.severity] !== sev[b.severity]) return sev[a.severity]-sev[b.severity];
    return b.overBy-a.overBy;
  });

  return signals.slice(0, 8);
}

// ============================================================
// SHOPPING LIST ENGINE
// Pure cost-sorted list of all unbuilt roster items.
// No evidence required — this is the "nothing pressing" queue.
// Includes: units, extensions, prison cells, storage rooms, storage items.
// Excludes: items already surfaced by buildRecs (evidence-driven).
// ============================================================
function buildShoppingList(checked, timestamps, calls) {
  var items = [];
  var totalCalls = calls ? calls.length : 0;

  var allStations = [].concat(
    FIRE_STATIONS.map(function(s){return {st:s,key:'fire'};}),
    PD_PRECINCTS.map(function(s){return {st:s,key:'pd'};}),
    PD_OUTPOSTS.map(function(s){return {st:s,key:'pd'};}),
    EMS_STATIONS.map(function(s){return {st:s,key:'ems'};}),
    AVIATION.map(function(s){return {st:s,key:'aviation'};}));

  function dept(key) {
    if (key==='fire') return 'fire';
    if (key==='pd') return 'pd';
    if (key==='ems') return 'ems';
    return key;
  }
  function tag(key) {
    return key==='ems'?'🚑':key==='pd'?'🚔':'🚒';
  }
  function stTag(key, id) {
    if (key==='fire') {
      if (String(id).match(/^MR\d+$/)) return String(id);
      return 'Stn '+id;
    }
    if (key==='pd') return String(id).match(/^\d+$/) ? 'P'+id : 'P-'+id;
    return String(id);
  }

  for (var _i=0; _i<allStations.length; _i++) {
    var _o = allStations[_i];
    var st = _o.st; var key = _o.key;
    var sKey = stId(key, st.id);
    var isBuilt = !!checked[sKey];

    if (!isBuilt) {
      // Show all unbuilt stations in shopping list (no evidence gate here)
      items.push({
        id: 'shop-stn-'+key+'-'+st.id,
        label: '['+stTag(key,st.id)+'] Build '+st.name,
        detail: (st.type==='mountain'?'Mountain Rescue':dept(key).toUpperCase()+' station')+(st.address?' — '+st.address:''),
        cost: st.buildCost || (st.type==='mountain' ? STATION_COST.mountain : (STATION_COST[key]||50000)),
        checkId: sKey,
        icon: tag(key),
        dept: dept(key),
        tag: 'Station',
      });
      continue;
    }

    var builtCount = st.units.filter(function(u){return !!checked[unitId(key,st.id,u.id)];}).length;
    var pendingIdx = builtCount;

    // Units
    for (var _ui=0; _ui<st.units.length; _ui++) {
      var u = st.units[_ui];
      var uid = unitId(key, st.id, u.id);
      if (checked[uid]) continue;
      if (st.extension && isUnitTimerBlocked(u.type, key, st.id, st.extension, timestamps)) continue;
      if (isUnitExtBlocked(u.id, st.extension, !!checked[extId(key, st.id)], u.type, st.extension2, !!checked[ext2Id(key, st.id)])) continue;
      if (isUnitBoatParkingBlocked(u.id, key, st.id, checked)) continue;
      if (isUnitGlobalBlocked(u.type, checked, u.id)) continue;
      items.push({
        id: 'shop-unit-'+key+'-'+st.id+'-'+u.id,
        label: '['+stTag(key,st.id)+'] Add '+u.id,
        detail: u.type==='Heavy Rescue Squad'?'Heavy Rescue Squad (Pumper + Rescue)':u.type,
        cost: unitCost(pendingIdx, u.type),
        checkId: uid,
        icon: tag(key),
        dept: dept(key),
        tag: 'Unit',
      });
      pendingIdx++;
    }

    // Extension
    if (st.extension) {
      var eid = extId(key, st.id);
      if (!checked[eid]) {
        var inProgress = TIMED_EXTENSIONS[st.extension] && allStations.some(function(_oo){
          var o2=_oo.st,k2=_oo.key;
          if (o2.id===st.id&&k2===key) return false;
          var oe = extId(k2,o2.id);
          return !!checked[oe] && !isExtTimerComplete(k2,o2.id,st.extension,timestamps);
        });
        if (!inProgress) {
          items.push({
            id: 'shop-ext-'+key+'-'+st.id,
            label: '['+stTag(key,st.id)+'] Add '+st.extension+' capability',
            detail: 'Extension bay / capability',
            cost: extCost(st.extension, key),
            checkId: eid,
            timerStartKey: TIMED_EXTENSIONS[st.extension] ? extTimerKey(key, st.id) : undefined,
            icon: '🏗',
            dept: dept(key),
            tag: 'Extension',
          });
        }
      }
    }

    // Second extension slot — "large" stations only (station.extension2 present)
    if (st.extension2) {
      var eid2 = ext2Id(key, st.id);
      if (!checked[eid2]) {
        items.push({
          id: 'shop-ext2-'+key+'-'+st.id,
          label: '['+stTag(key,st.id)+'] Add '+st.extension2+' capability',
          detail: 'Extension bay / capability (2nd slot — large station)',
          cost: extCost(st.extension2, key),
          checkId: eid2,
          timerStartKey: TIMED_EXTENSIONS[st.extension2] ? extTimerKey(key, st.id) : undefined,
          icon: '🏗',
          dept: dept(key),
          tag: 'Extension',
        });
      }
    }

    // Boat parking upgrade — large marine stations, one-time
    var _bpCfg = BOAT_PARKING_CONFIG[st.id];
    if (_bpCfg) {
      var bpid = boatParkingId(key, st.id);
      if (!checked[bpid]) {
        items.push({
          id: 'shop-boatparking-'+key+'-'+st.id,
          label: '['+stTag(key,st.id)+'] Add Boat Parking Spots',
          detail: 'Raises Patrol Boat capacity 2 \u2192 4',
          cost: _bpCfg.cost,
          checkId: bpid,
          icon: '🅿️',
          dept: dept(key),
          tag: 'Extension',
        });
      }
    }

    // Prison cells (PD) — TOW is a tow-truck outpost with no holding cells
    if (key==='pd' && st.command !== undefined && !NO_CELLS_STATION_IDS.has(st.id)) {
      var _cellMax2 = prisonCellMax(st.id);
      var _cellBuilt = 0;
      for (var _cbi = 1; _cbi <= _cellMax2; _cbi++) { if (checked[prisonId(key, st.id, _cbi)]) _cellBuilt++; else break; }
      if (_cellBuilt < _cellMax2) {
        var _nextCell = _cellBuilt + 1;
        var cellNid = prisonId(key, st.id, _nextCell);
        items.push({id:'shop-cell'+_nextCell+'-'+st.id,
          label:'['+stTag(key,st.id)+'] Add '+(_nextCell===1?'Prison Cell':'Prison Cell '+_nextCell),
          detail:'Holding cell — Cell '+_nextCell+' of '+_cellMax2+' — 7 days to build',cost:PRISON_CELL_COST,checkId:cellNid,
          timerStartKey: prisonCellTimerKey(key, st.id, _nextCell),
          computeTimerStart: (function(_k, _sId, _idx){ return function(ts){ return prisonCellStartTime(_k, _sId, _idx, ts); }; })(key, st.id, _nextCell),
          icon:'🔒',dept:dept(key),tag:'Prison Cell'});
      }
    }

    // Parking lot spaces (e.g. Tow Truck Station impound lot) — bought one at a
    // time; the next slot isn't offered until the previous slot's timer completes.
    var _pcfg2 = PARKING_LOT_CONFIG[st.id];
    if (_pcfg2) {
      var _pBuilt = parkingSpacesBuilt(checked, key, st.id);
      var _pLastTimerDone = _pBuilt === 0 || isParkingTimerComplete(key, st.id, _pBuilt, timestamps);
      if (_pBuilt < _pcfg2.max && _pLastTimerDone) {
        var _pNextIdx = _pBuilt + 1;
        items.push({
          id: 'shop-parking-'+key+'-'+st.id+'-'+_pNextIdx,
          label: '['+stTag(key,st.id)+'] Add Parking Lot Space',
          detail: 'Space '+_pNextIdx+' of '+_pcfg2.max+' — '+_pcfg2.label+' to build',
          cost: _pcfg2.cost,
          checkId: parkingSpaceId(key, st.id, _pNextIdx),
          timerStartKey: parkingTimerKey(key, st.id, _pNextIdx),
          icon: '🅿️',
          dept: dept(key),
          tag: 'Parking Space',
        });
      }
    }

    // Storage room + items
    if (hasAnyStorage(st, key)) {
      var srBuilt = !!checked[storageRoomKey(key, st.id)];
      if (!srBuilt) {
        items.push({
          id:'shop-storroom-'+key+'-'+st.id,
          label:'['+stTag(key,st.id)+'] Build storage room',
          detail:'Required before equipping any storage items',
          cost:25000,checkId:storageRoomKey(key,st.id),
          icon:'🏗',dept:dept(key),tag:'Storage Room'});
      } else {
        var storSp = storageSpacesNeeded(st.units, key);
        var _exp1B = !!checked[storageRoomExpKey(key,st.id)];
        var _exp2B = !!checked[storageRoomExp2Key(key,st.id)];
        if (storSp > 40 && !_exp1B) {
          items.push({
            id:'shop-storexp-'+key+'-'+st.id,
            label:'['+stTag(key,st.id)+'] Expand storage room',
            detail:storSp+' spaces needed — expansion adds 30sp (70 total)',
            cost:50000,checkId:storageRoomExpKey(key,st.id),
            icon:'🏗',dept:dept(key),tag:'Storage Expansion'});
        } else if (storSp > 70 && _exp1B && !_exp2B) {
          items.push({
            id:'shop-storexp2-'+key+'-'+st.id,
            label:'['+stTag(key,st.id)+'] Add 3rd storage room',
            detail:storSp+' spaces needed — 3rd room adds 30sp (100 total)',
            cost:50000,checkId:storageRoomExp2Key(key,st.id),
            icon:'🏗',dept:dept(key),tag:'Storage Expansion'});
        }
        var storExpBuilt = _exp1B;
        var storCapacity = _exp2B ? 100 : (_exp1B ? 70 : 40);
        var storUsed = 0;
        // Calculate already-equipped storage usage
        for (var _stpre=0; _stpre<st.units.length; _stpre++) {
          var suPre = st.units[_stpre];
          var storPre = storageDefaults(key, suPre.id);
          for (var _sipre=0; _sipre<storPre.length; _sipre++) {
            if (!!checked[storageItemKey(key,st.id,suPre.id,storPre[_sipre])]) {
              storUsed += itemSpaces(storPre[_sipre]);
            }
          }
        }
        for (var _sti=0; _sti<st.units.length; _sti++) {
          var su = st.units[_sti];
          // Gate: unit must be built before recommending its storage items
          if (!checked[unitId(key, st.id, su.id)]) continue;
          var stor = storageDefaults(key, su.id);
          for (var _sii=0; _sii<stor.length; _sii++) {
            var sitem = stor[_sii];
            var sid = storageItemKey(key, st.id, su.id, sitem);
            if (!checked[sid]) {
              var spaceNeeded = itemSpaces(sitem);
              // Gate: don't recommend if storage is full and expansion not built
              if (storUsed + spaceNeeded > storCapacity) continue;
              items.push({
                id:'shop-stor-'+key+'-'+st.id+'-'+su.id+'-'+sitem,
                label:'['+stTag(key,st.id)+'] '+sitem+' \u2192 '+su.id,
                detail:st.name,
                cost:st.type==='mountain'?25000:STORAGE_COST,
                checkId:sid,icon:'📦',dept:dept(key),tag:'Storage'});
              storUsed += spaceNeeded;
              break; // one storage item per unit at a time
            }
          }
        }
      }
    }
  }

  // Sort: cost ascending (cheapest first), then by tag priority
  // Sort: cost ascending (cheapest first), then by tag priority. No cap here —
  // the display layer (RecsTab) does its own sizing after merging with urgent
  // pressure items; capping here as well was silently dropping any item that
  // didn't rank in the global top 10 cheapest across the ENTIRE county, even
  // when it was tied for cheapest at its own station.
  var TAG_ORDER = {'Unit':0,'Extension':1,'Parking Space':1,'Prison Cell':2,'Storage Room':3,'Storage Expansion':4,'Storage':5,'Station':6};
  items.sort(function(a,b) {
    if (a.cost !== b.cost) return a.cost - b.cost;
    var ta = TAG_ORDER[a.tag]!=null?TAG_ORDER[a.tag]:9;
    var tb = TAG_ORDER[b.tag]!=null?TAG_ORDER[b.tag]:9;
    return ta-tb;
  });

  return items;
}


function formatCost(n) {
  if (n === 0) return 'Free';
  if (n >= 1000000) return `$${(n/1000000).toFixed(1)}M`;
  return `$${(n/1000).toFixed(0)}k`;
}

function isUnitDeployable(unitType, chk, dept) {
  // Check direct type match

  if (req) {
    if (!isAcademyBuilt(req.academyId, chk) || !isClassComplete(req.academyId, req.classId, chk)) return false;

function parkingSpaceId(key, stId, idx) { return `parking::${key}::${stId}::${idx}`; }
function parkingTimerKey(key, stId, idx) { return `timer:parking:${key}:${stId}:${idx}`; }
function parkingSpacesBuilt(checked, key, stId) {
  var cfg = PARKING_LOT_CONFIG[stId];
  if (!cfg) return 0;

  for (var i = 1; i <= cfg.max; i++) { if (checked[parkingSpaceId(key, stId, i)]) n++; else break; }

}
function isParkingTimerComplete(key, stId, idx, timestamps) {
  var cfg = PARKING_LOT_CONFIG[stId];
  if (!cfg) return true;
  var start = timestamps[parkingTimerKey(key, stId, idx)];
  if (!start) return false;
  return (Date.now() - start) >= cfg.durationMs;
}
function parkingTimerRemaining(key, stId, idx, timestamps) {
  var cfg = PARKING_LOT_CONFIG[stId];
  if (!cfg) return 0;
  var start = timestamps[parkingTimerKey(key, stId, idx)];
  if (!start) return cfg.durationMs;
  return Math.max(0, cfg.durationMs - (Date.now() - start));
}

  'Tactical Rescue Truck with Boat': 'Police Water Rescue',
};

// Units that require a minimum number of built EMS stations before they can be placed.
// Keys can be unit type strings OR specific unit IDs (ID takes priority over type).
// Value: { minEmsStations, label }
const UNIT_GLOBAL_STATION_PREREQ = {
  // By type
  'Mass Casualty Unit': { minEmsStations: 20, label: '20 EMS stations' },
  // By unit ID (EMS Operations Support / LSU)
  'EMS LSU 01':         { minEmsStations: 20, label: '20 EMS stations' },
  'EMS LSU 02':         { minEmsStations: 40, label: '40 EMS stations' },
};

function isUnitGlobalBlocked(unitType, checkedUnits, unitIdStr) {
  // ID-specific gate takes priority over type gate
  var prereq = (unitIdStr && UNIT_GLOBAL_STATION_PREREQ[unitIdStr])
    || UNIT_GLOBAL_STATION_PREREQ[unitType];
  if (!prereq) return false;
  var builtEms = EMS_STATIONS.filter(function(st) {
    return !!checkedUnits[unitId('ems', st.id, '__ST__')];
  }).length;
  return builtEms < prereq.minEmsStations;
}

function unitGlobalBlockedLabel(unitType, unitIdStr) {
  var prereq = (unitIdStr && UNIT_GLOBAL_STATION_PREREQ[unitIdStr])
    || UNIT_GLOBAL_STATION_PREREQ[unitType];
  return prereq ? prereq.label : '';
}

function isUnitExtBlocked(unitId, stExtension, extChecked, unitType, stExtension2, ext2Checked) {
  // ID-specific gate (e.g. 06A BLS requires Ambulance extension)
  var req = UNIT_EXT_REQUIRED[unitId];
  if (!req && unitType) req = UNIT_TYPE_EXT_REQUIRED[unitType];
  if (!req) return false;
  if (stExtension === req) return !extChecked;
  // "Large" stations get a second, independent extension slot (station.extension2).
  // A unit gated by that second extension checks against it instead — passed as
  // two extra optional args so existing single-extension callers are unaffected.
  if (stExtension2 !== undefined && stExtension2 === req) return !ext2Checked;
  return false;
}

function extTimerKey(key, stId)     { return `timer:ext:${key}:${stId}`; }
function getExtTimerStart(key, stId, timestamps) {
  return timestamps[extTimerKey(key, stId)] || null;
}
function isExtTimerComplete(key, stId, extension, timestamps) {
  const te = TIMED_EXTENSIONS[extension];
  if (!te) return true; // no timer = always complete
  const start = getExtTimerStart(key, stId, timestamps);
  if (!start) return false;
  return (Date.now() - start) >= te.durationMs;
}
function extTimerRemaining(key, stId, extension, timestamps) {
  const te = TIMED_EXTENSIONS[extension];
  if (!te) return 0;
  const start = getExtTimerStart(key, stId, timestamps);
  if (!start) return te.durationMs;
  const remaining = te.durationMs - (Date.now() - start);
  return Math.max(0, remaining);
}
function formatRemaining(ms) {
  if (ms <= 0) return 'Complete';
  const totalSecs = Math.floor(ms / 1000);
  const days  = Math.floor(totalSecs / 86400);
  const hours = Math.floor((totalSecs % 86400) / 3600);
  const mins  = Math.floor((totalSecs % 3600) / 60);
  const secs  = totalSecs % 60;
  if (days > 0) return `${days}d ${hours}h ${mins}m`;
  if (hours > 0) return `${hours}h ${mins}m ${secs}s`;
  return `${mins}m ${secs}s`;
}
function isUnitTimerBlocked(unitType, key, stId, extension, timestamps) {
  const te = TIMED_EXTENSIONS[extension];
  if (!te) return false;
  if (!te.unlockedTypes.includes(unitType)) return false;
  return !isExtTimerComplete(key, stId, extension, timestamps);
}

function getMemberNames(count) {

  const names = [];
  for (let i = 0; i < count; i++) {

  return names;
}

// Helper: get EMS course IDs for an EMS unit type
function getEMSUnitCourseIds(unitType, station) {
  var courses = (EMS_UNIT_TYPE_COURSE[unitType] || []).slice();
  // Station-composition: an EMS chief/Lt at a station with an H, Z, or R unit needs HazMat Medic
  if (station && station.units && (unitType === 'EMS Supervisor' || unitType === 'EMS Supervisor (home)')) {
    var _hzr = station.units.some(function(u){
      return u.type === 'BLS Hazmat' || u.type === 'ALS Hazmat' || u.type === 'Rescue Medic (ALS)';
    });
    var _hm = deptCourseId('ems','hazmat-medic');
    if (_hzr && courses.indexOf(_hm) < 0) courses.push(_hm);
  }
  return courses;
}

// Helper: get all EMS members needing a specific course
// Also handles cross-dept ALS fire apparatus members for als-fire-apparatus course
function getEMSMembersNeedingCourse(courseId, checkedUnits, trainedKeys) {
  const members = [];
  const alsFireCourseId = deptCourseId('ems','als-fire-apparatus');
  const mtnRescueId = deptCourseId('ems','mountain-rescue');
  const mtnDogId    = deptCourseId('ems','mountain-dog');

  // Normal EMS stations
  for (const st of EMS_STATIONS) {
    for (const u of st.units) {
      const courseIds = getEMSUnitCourseIds(u.type, st);
      if (!courseIds.includes(courseId)) continue;
      const staffCount = unitStaff(u.id, u.type) || 0;
      if (!staffCount) continue;
      const uid = unitId('ems', st.id, u.id);
      if (!checkedUnits[uid]) continue;
      const names = getMemberNames(staffCount);
      for (const name of names) {
        const tkey = memberTrainedKey('ems', st.id, u.id, name, courseId);
        if (!trainedKeys[tkey]) {
          members.push({ stationName: st.name, unitId: u.id, unitType: u.type, memberName: name, trainedKey: tkey, crossDept: false });
        }
      }
    }
  }

  // Mountain courses: units live in FIRE_STATIONS mountain houses but train at the EMS academy
  if (courseId === mtnRescueId || courseId === mtnDogId) {
    for (const st of FIRE_STATIONS) {
      if (st.type !== 'mountain') continue;
      for (const u of st.units) {
        const courseIds = getEMSUnitCourseIds(u.type, st);
        if (!courseIds.includes(courseId)) continue;
        const staffCount = unitStaff(u.id, u.type) || 0;
        if (!staffCount) continue;
        const uid = unitId('fire', st.id, u.id);
        if (!checkedUnits[uid]) continue;
        const names = getMemberNames(staffCount);
        for (const name of names) {
          // EMS-scoped trained record (course is taught/owned by EMS academy)
          const tkey = memberTrainedKey('ems', st.id, u.id, name, courseId);
          if (!trainedKeys[tkey]) {
            members.push({ stationName: st.name, unitId: u.id, unitType: u.type, memberName: name, trainedKey: tkey, crossDept: false });
          }
        }
      }
    }
  }

  // Cross-dept exception: ALS on FD units need als-fire-apparatus at EMS academy
  if (courseId === alsFireCourseId) {
    for (const st of FIRE_STATIONS) {
      for (const u of st.units) {
        if (!CROSS_DEPT_ALS_TYPES.has(u.type)) continue;
        const staffCount = unitStaff(u.id, u.type) || 0;
        if (!staffCount) continue;
        const uid = unitId('fire', st.id, u.id);
        if (!checkedUnits[uid]) continue;
        const names = getMemberNames(staffCount);
        for (const name of names) {
          // Use fire dept key so the trained record is scoped to FD
          const tkey = memberTrainedKey('fire', st.id, u.id, name, courseId);
          if (!trainedKeys[tkey]) {
            members.push({ stationName: st.name + ' (FD)', unitId: u.id, unitType: u.type, memberName: name, trainedKey: tkey, crossDept: true });
          }
        }
      }
    }
  }

  return members;
}

function getPDUnitCourseIds(unitId, unitType) {
  var s = new Set(PD_UNIT_TYPE_COURSE[unitType] || []);
  // Equipment-driven courses (e.g. a unit carrying a Drone needs Drone Operator)
  var items = storageDefaults('pd', unitId);
  for (var i = 0; i < items.length; i++) {
    var c = STORAGE_ITEM_COURSE[items[i]];
    if (c) s.add(c);
  }
  // Unit-instance specific courses (e.g. Riot Patrol 1 -> Riot Police Training)
  var _inst = UNIT_INSTANCE_COURSE[unitId] || [];
  for (var _j = 0; _j < _inst.length; _j++) s.add(_inst[_j]);

// Get all training requirements for a unit

// ============================================================
// FIRST-DUE FIDELITY (county-agnostic; here wired to Greene boxes via c.boxIds)
// expected 1st-due per class = unit with lowest MEDIAN response into the area
// (≥5 timed local responses); fidelity = % of class-calls where expected was 1st.
// gate: ≥10 class-calls into the area before a class is scored.
// ============================================================
function _fidMedian(arr){
  if(!arr||!arr.length) return Infinity;
  var s=arr.slice().sort(function(a,b){return a-b;});
  var m=Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
function _fidClassOf(dueOrder){
  if(!dueOrder) return null;
  var m=String(dueOrder).match(/due\s+([a-z]+)/i);
  return m ? m[1].toLowerCase() : null;
}
// Classify an assigned unit by its TYPE, not its dueOrder label — a lone unit of a class
// (typical for rescue/chief) has no ordinal label, so label-parsing would miss it entirely.
// Module-scope uid -> unit-type lookup. The component-scope ALL_UNIT_TYPE_MAP / dueOrderGroup
// aren't reachable from here, which is why label-parsing was silently used before (and failed
// for single-unit classes like rescue). Built from the module-scope station consts.
var _FID_TYPE_MAP = (function(){
  var m={};
  function add(sts){ (sts||[]).forEach(function(s){ (s.units||[]).forEach(function(u){ if(u&&u.id) m[u.id]=u.type; }); }); }
  try {
    if(typeof FIRE_STATIONS!=='undefined') add(FIRE_STATIONS);
    if(typeof EMS_STATIONS!=='undefined') add(EMS_STATIONS);
    if(typeof PD_PRECINCTS!=='undefined') add(PD_PRECINCTS);
    if(typeof PD_OUTPOSTS!=='undefined') add(PD_OUTPOSTS);
  } catch(e){}
  return m;
})();
// Class-from-type for fidelity (engine/ladder/chief/rescue only) — mirrors dueOrderGroup.
function _fidClassFromType(t){
  if(!t) return null;
  if(t==='Pumper'||t==='Reserve Pumper'||t==='Heavy Rescue Squad') return 'engine';
  if(t==='Aerial Ladder'||t==='Tower Ladder') return 'ladder';
  if(t==='Heavy Rescue Vehicle'||t==='Mountain Height Rescue') return 'rescue';
  if(t==='Battalion Chief'||t==='Division Chief') return 'chief';
  return null;
}
function _fidClassOfUnit(u){
  var g = _fidClassFromType(u && _FID_TYPE_MAP[u.uid]);
  if(g) return g;
  return _fidClassOf(u && u.dueOrder);
}
function computeBoxFidelity(boxId, calls){
  var areaCalls=(calls||[]).filter(function(c){return c.boxIds && c.boxIds.indexOf(boxId)>=0;});
  var CLASSES=['engine','ladder','chief','rescue'];
  var EXCLUDE={'Upon Completion':1,'Mutual Aid':1,'Staffing':1};
  var res={total:areaCalls.length, classes:{}};
  CLASSES.forEach(function(cls){
    var unitTimes={};   // uid -> [secs] (local, real responses only)
    var classCalls=[];  // calls that dispatched this class
    areaCalls.forEach(function(c){
      var au=c.assignedUnits||[]; var has=false;
      au.forEach(function(u){
        if(_fidClassOfUnit(u)!==cls) return;
        has=true;
        if(u.responseTimeSecs!=null && u.responseTimeSecs>0 && !EXCLUDE[u.response]){
          (unitTimes[u.uid]=unitTimes[u.uid]||[]).push(u.responseTimeSecs);
        }
      });
      if(has) classCalls.push(c);
    });
    var entry={classCalls:classCalls.length};
    if(classCalls.length<10){ entry.gated=true; res.classes[cls]=entry; return; }
    var expected=null, expMed=Infinity;
    Object.keys(unitTimes).forEach(function(uid){
      if(unitTimes[uid].length<5) return;
      var med=_fidMedian(unitTimes[uid]);
      if(med<expMed){ expMed=med; expected=uid; }
    });
    if(!expected){ entry.noExpected=true; res.classes[cls]=entry; return; }
    var hit=0;
    classCalls.forEach(function(c){
      // 1st due = the class unit with the fastest real response on this call (label-independent,
      // so a lone rescue/chief counts). Hit if that unit is the expected (fastest-median) one.
      var clsUnits=(c.assignedUnits||[]).filter(function(u){
        return _fidClassOfUnit(u)===cls && u.responseTimeSecs!=null && u.responseTimeSecs>0 && !EXCLUDE[u.response];
      });
      if(!clsUnits.length) return;
      var first=clsUnits.reduce(function(a,b){ return b.responseTimeSecs<a.responseTimeSecs?b:a; });
      if(first.uid===expected) hit++;
    });
    entry.expected=expected; entry.expMedianSecs=expMed; entry.hit=hit;
    entry.fidelity=Math.round(hit/classCalls.length*100);
    res.classes[cls]=entry;
  });
  return res;
}

// ── Run Card Storage Helpers ─────────────────────────────────────────────────
var RC_STORAGE_PREFIX = 'gcdes-runcard-v1::';

async function rcLoad(distOrAtomId) {
  try {
    var r = await window.storage.get(RC_STORAGE_PREFIX + distOrAtomId);
    return r ? JSON.parse(r.value) : [];
  } catch(e) { return []; }
}

async function rcSave(distOrAtomId, entries) {
  try {
    await window.storage.set(RC_STORAGE_PREFIX + distOrAtomId, JSON.stringify(entries));
  } catch(e) { console.error('rcSave error', e); }
}

// ── Alarm assignment structure ───────────────────────────────────────────────
// Each alarm ADDS the slots below; rosters are cumulative (a 3rd alarm = 1st→3rd).
// Slots fill from the district's responders, fastest adjusted time first, each unit
// used once across the whole progression. Engine slots accept squads; the dedicated
// squad slot fills after the engines so it's genuinely "in addition."
var ALARM_LEVELS = ['1st Alarm','All Hands','2nd Alarm','3rd Alarm','4th Alarm','5th Alarm'];
function buildAlarmSlots() {
  var ENG = ['Pumper','Heavy Rescue Squad'];
  var LAD = ['Aerial Ladder','Tower Ladder'];
  var slots = [];
  function add(lvl, role, types, n, prefer) { for (var i=0;i<n;i++) slots.push({lvl:lvl, role:role, types:types, prefer:prefer||null}); }
  // 1st Alarm
  add(0,'Engine',ENG,4); add(0,'Ladder',LAD,2); add(0,'Chief (BC)',['Battalion Chief'],1);
  add(0,'Rescue',['Heavy Rescue Vehicle'],1); add(0,'Squad',['Heavy Rescue Squad'],1);
  // All Hands
  add(1,'Ladder',LAD,1); add(1,'Chief (BC)',['Battalion Chief'],1);
  add(1,'Mask Service',['Mask Service','Mask Service Unit'],1);
  // 2nd Alarm
  add(2,'Engine',ENG,2); add(2,'Ladder',LAD,1);
  // 3rd Alarm — the one break: chief is a Division Chief
  add(3,'Engine',ENG,2); add(3,'Ladder',LAD,1); add(3,'Chief (DC)',['Division Chief'],1);
  // 4th Alarm
  add(4,'Engine',ENG,2); add(4,'Ladder',LAD,1);
  // 5th Alarm
  add(5,'Engine',ENG,2); add(5,'Ladder',LAD,1); add(5,'Chief (BC)',['Battalion Chief'],1);
  return slots;
}
var ALARM_SLOTS = buildAlarmSlots();

// ── RunCard component ─────────────────────────────────────────────────────────
function RunCard(props) {
  var id = props.id; // district or atom id
  var label = props.label;
  var dept = props.dept || 'all'; // 'fire','ems','pd','all'
  var _localSet = props.localSet || COL_UNIT_ID_SET; // reversed for Greene boxes
  var [entries, setEntries] = React.useState(null);
  var [alarmLevel, setAlarmLevel] = React.useState(null);

  React.useEffect(function(){
    rcLoad(id).then(function(data){ setEntries(data||[]); });
  }, [id]);

  if (entries === null) return (
    <div style={{padding:'20px',textAlign:'center',color:'#888',fontSize:12}}>Loading run card...</div>
  );

  function clearCard() {
    if (window.confirm('Clear all run card data for '+id+'? This cannot be undone.')) {
      rcSave(id, []).then(function(){ setEntries([]); });
    }
  }

  // Build column stats: { colId: { unitId: { count, totalSecs, label } } }
  var colStats = {};
  RC_COLUMNS.forEach(function(col){ colStats[col.id] = {}; });

  // Determine which dept categories to include for unit filtering
  var _deptFire = dept==='all'||dept==='fire'||dept==='fireems';
  var _deptEms  = dept==='all'||dept==='ems'||dept==='fireems';
  var _deptPd   = dept==='all'||dept==='pd';

  entries.forEach(function(entry) {
    (entry.units||[]).forEach(function(u) {
      // Always recompute rcCols from dispatchType — stored values may be stale
      var cols = dispatchTypeToRcColumns(u.dispatchType||'');
      // Filter units by dept: only include units whose columns match the active dept
      var relevantCols = cols.filter(function(colId) {
        var col = RC_COLUMNS.find(function(c){return c.id===colId;});
        if (!col) return false;
        if (col.dept==='fire') return _deptFire;
        if (col.dept==='ems')  return _deptEms;
        if (col.dept==='pd')   return _deptPd;
        return false;
      });
      if (relevantCols.length === 0) return; // skip units not relevant to this dept
      relevantCols.forEach(function(colId) {
        if (!colStats[colId]) return;
        if (!colStats[colId][u.unitId]) {
          colStats[colId][u.unitId] = {count:0, timedCount:0, totalSecs:0, label:u.unitId};
        }
        colStats[colId][u.unitId].count++;
        if (u.responseSecs && u.responseSecs > 0) {
          // Out-of-county (non-Columbia) units mutual-aiding into Columbia take a
          // +15:00 penalty per response so the run-card average reflects the real cost
          // of leaning on mutual aid. Stored responseSecs is left untouched (raw).
          var _ooc = !_localSet.has(u.unitId);
          colStats[colId][u.unitId].totalSecs += u.responseSecs + (_ooc ? 900 : 0);
          colStats[colId][u.unitId].timedCount++;
          colStats[colId][u.unitId].ooc = _ooc;
        }
      });
    });
  });

  // ── Alarm assignment: rank district responders by adjusted avg, draft into slots ──
  var _unitAgg = {};
  entries.forEach(function(e){ (e.units||[]).forEach(function(u){
    if (!u.unitId) return;
    if (!_unitAgg[u.unitId]) _unitAgg[u.unitId] = {unitId:u.unitId, type:u.dispatchType||'', count:0, totalAdj:0, ooc:!_localSet.has(u.unitId)};
    var a = _unitAgg[u.unitId];
    if (u.responseSecs && u.responseSecs > 0) { a.count++; a.totalAdj += u.responseSecs + (a.ooc?900:0); }
  }); });
  var rankedUnits = Object.keys(_unitAgg).map(function(k){ var a=_unitAgg[k]; a.avg = a.count>0 ? a.totalAdj/a.count : Infinity; return a; })
    .filter(function(a){ return a.count>0; })
    .sort(function(a,b){ return a.avg - b.avg; });
  var _usedUnit = {};
  var alarmAssign = ALARM_SLOTS.map(function(slot){
    var pick = null;
    // No type preference: fastest eligible unit fills the slot. A unit already
    // drafted into an earlier slot is unavailable, so a Squad used in an Engine
    // spot leaves the Squad slot needing a separate squad. (slot.prefer is an
    // optional toggle to bias a slot toward a type; currently unused.)
    if (slot.prefer) {
      for (var p=0;p<rankedUnits.length;p++){ var up=rankedUnits[p];
        if (_usedUnit[up.unitId]) continue;
        if (up.type === slot.prefer) { pick=up; break; }
      }
    }
    if (!pick) for (var i=0;i<rankedUnits.length;i++){ var u=rankedUnits[i];
      if (_usedUnit[u.unitId]) continue;
      if (slot.types.indexOf(u.type) >= 0) { pick=u; break; }
    }
    if (pick) _usedUnit[pick.unitId] = true;
    return {lvl:slot.lvl, role:slot.role, types:slot.types, unit:pick};
  });

  // ── QA targets: 1st-due engine, full 1st alarm, full All Hands assembled times ──
  // "Assembled" = slowest adjusted time among the units drafted through that level
  // (rosters are cumulative). An unfilled slot means the level can't assemble at all.
  var qaTargets = props.qaTargets || null;
  var qa = null;
  if (qaTargets) {
    var _assembledAdj = function(maxLvl){
      var maxAdj = 0, unfilled = false;
      alarmAssign.forEach(function(a){
        if (a.lvl > maxLvl) return;
        if (!a.unit || !isFinite(a.unit.avg)) { unfilled = true; return; }
        if (a.unit.avg > maxAdj) maxAdj = a.unit.avg;
      });
      return {maxAdj:maxAdj, unfilled:unfilled};
    };
    var _firstEng = null;
    for (var _qi=0; _qi<alarmAssign.length; _qi++) {
      var _aa = alarmAssign[_qi];
      if (_aa.lvl===0 && _aa.role==='Engine' && _aa.unit && isFinite(_aa.unit.avg)) { _firstEng = _aa.unit.avg; break; }
    }
    var _a1 = _assembledAdj(0);
    var _ah = _assembledAdj(1);
    qa = [
      {key:'1st Engine', tgt:qaTargets.firstEngine, val:_firstEng, unfilled:_firstEng===null},
      {key:'1st Alarm',  tgt:qaTargets.firstAlarm,  val:_a1.unfilled?null:_a1.maxAdj, unfilled:_a1.unfilled},
      {key:'All Hands',  tgt:qaTargets.allHands,    val:_ah.unfilled?null:_ah.maxAdj, unfilled:_ah.unfilled}
    ];
  }

  var deptCols = RC_COLUMNS.filter(function(c){
    if (dept==='all') return true;
    if (dept==='fireems') return c.dept==='fire' || c.dept==='ems';
    return c.dept===dept;
  });
  var activeCols = deptCols.filter(function(c){
    return Object.keys(colStats[c.id]||{}).length > 0;
  });

  function fmtSecs(s) {
    if (!s) return '—';
    var m = Math.floor(s/60), sec = Math.round(s%60);
    return m+':'+(sec<10?'0':'')+sec;
  }

  if (activeCols.length === 0) return (
    <div style={{padding:'16px',textAlign:'center',color:'#aaa',fontSize:12,fontStyle:'italic'}}>
      No run card data yet — responses will appear here as calls are logged.
    </div>
  );

  return (
    <div style={{padding:'8px 0'}}>
      <div style={{fontSize:11,color:'#888',marginBottom:8,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span>{entries.length} call{entries.length!==1?'s':''} recorded</span>
        <button onClick={clearCard}
          style={{fontSize:10,padding:'2px 8px',borderRadius:4,border:'1px solid #e0e0e0',
            background:'white',color:'#c0392b',cursor:'pointer'}}>
          Clear
        </button>
      </div>

      {qa && (
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
          {qa.map(function(b,bi){
            var ok = !b.unfilled && b.val!=null && b.val <= b.tgt;
            var amber = b.unfilled;
            var bg = ok ? '#eef6ef' : (amber ? '#fff7e6' : '#fdf2f2');
            var bd = ok ? '#bfe3c3' : (amber ? '#ffe0a3' : '#f5b7b1');
            var fg = ok ? '#1e7a32' : (amber ? '#b9770e' : '#c0392b');
            return (
              <div key={bi} style={{flex:'1 1 0',minWidth:96,background:bg,border:'1px solid '+bd,
                borderRadius:7,padding:'6px 8px'}}>
                <div style={{fontSize:9.5,fontWeight:700,color:'#667',textTransform:'uppercase',letterSpacing:0.3}}>{b.key}</div>
                <div style={{display:'flex',alignItems:'baseline',gap:4,marginTop:2}}>
                  <span style={{fontFamily:'monospace',fontSize:14,fontWeight:800,color:fg}}>
                    {b.unfilled ? '—' : fmtSecs(b.val)}
                  </span>
                  <span style={{fontSize:9.5,color:'#999'}}>&le; {fmtSecs(b.tgt)}</span>
